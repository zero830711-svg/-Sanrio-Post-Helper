<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Xアーカイブ修復 3260</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;background:#fff7fb;color:#352936}
.card{background:#fff;border:1px solid #eadce7;border-radius:16px;padding:1rem;margin:1rem 0}
button,label{display:inline-block;padding:.75rem 1rem;border-radius:10px;border:1px solid #d6bfd0;background:#fff;cursor:pointer;margin:.25rem}
.primary{background:#e85d9e;color:#fff;border:0;font-weight:700}
button:disabled{opacity:.5}
input[type=text],input[type=password]{width:95%;padding:.6rem}
input[type=file]{max-width:100%}
progress{width:100%;margin:1rem 0}
#log{white-space:pre-wrap;background:#271f29;color:#fff;padding:1rem;border-radius:10px;min-height:10rem;max-height:360px;overflow:auto}
.muted{color:#756775}.build{font-size:.85rem;font-weight:700;color:#8a7484}.ok{color:#2f6a43;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Xアーカイブ修復</h1>
<p class="build">BUILD 3260</p>
<p class="muted">写真・動画は再アップロードしません。Xアーカイブの <strong>tweets.js</strong> から元投稿全文だけを復元できます。</p>

<section class="card">
<h2>① 元投稿全文を修復</h2>
<p class="muted">前回Xアーカイブ取り込みをした同じPC・同じChromeで実行してください。</p>
<label>tweets.js を選択
<input id="tweetFile" type="file" accept=".js,text/javascript"></label>
<label>note-tweet.js を選択（長文投稿の全文用）
<input id="noteFile" type="file" accept=".js,text/javascript"></label>
<button id="repairText" class="primary" type="button" disabled>投稿本文を完全修復</button>
<p id="textStatus" class="muted">data フォルダ内の tweets.js と note-tweet.js を選んでください。note-tweet.js がない場合は通常投稿だけ修復します。</p>
</section>

<section class="card">
<h2>② 画像URL再同期（必要なときだけ）</h2>
<button id="repairMedia" type="button">画像URLだけ再同期</button>
<p class="muted">画像そのものは送りません。</p>
</section>

<section class="card">
<label>API URL<br><input id="api" type="text" value="https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/archive-media-batch.php"></label>
<label>同期キー<br><input id="key" type="password"></label>
</section>

<progress id="bar" value="0" max="1"></progress>
<pre id="log">BUILD 3260 準備完了。</pre>
</main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),log=$("log"),bar=$("bar"),KEY="sanrioCloudSyncKey";
$("key").value=localStorage.getItem(KEY)||"";
let parsedTweets=[],parsedNotes=[];
const say=s=>{log.textContent+="\n"+s;log.scrollTop=log.scrollHeight};
function parseArchiveArray(text,label){
  const m=text.match(/=\s*(\[[\s\S]*\])\s*;?\s*$/);
  if(!m)throw new Error(label+" を解析できません");
  return JSON.parse(m[1]);
}
function parseTweetJs(text){
  return parseArchiveArray(text,"tweets.js").map(x=>x.tweet||x).filter(x=>x&&(x.id||x.id_str));
}
function parseNoteJs(text){
  return parseArchiveArray(text,"note-tweet.js").map(x=>x.noteTweet||x).filter(x=>x&&x.core&&x.core.text);
}
function normalizeForMatch(s){
  return String(s||"")
    .replace(/https?:\/\/t\.co\/\S+/g," ")
    .replace(/[.…]+\s*$/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function attachNoteFullText(tweets,notes){
  if(!notes.length)return {matched:0};
  const pool=notes.map(n=>({n,text:String(n.core?.text||""),norm:normalizeForMatch(n.core?.text||"")}));
  let matched=0;
  for(const t of tweets){
    const short=normalizeForMatch(t.full_text||t.text||"");
    if(!short)continue;
    let best=-1,bestScore=0;
    for(let i=0;i<pool.length;i++){
      const p=pool[i]; if(!p)continue;
      let score=0;
      if(p.norm.startsWith(short))score=short.length+1000;
      else if(short.length>=30&&p.norm.includes(short.slice(0,Math.min(short.length,120))))score=Math.min(short.length,120);
      if(score>bestScore){best=i;bestScore=score}
    }
    if(best>=0){
      t.__fullText=pool[best].text;
      pool[best]=null;
      matched++;
    }
  }
  return {matched};
}
function archiveTweetId(t){return String(t?.id_str||t?.id||"").trim()}
function statusIdFromUrl(url){const m=String(url||"").match(/status\/(\d+)/);return m?m[1]:""}
function localPostId(item){return String(item?.postId||statusIdFromUrl(item?.xUrl)||"").trim()}
function textQuality(value){
  const s=String(value||"").trim();
  if(!s)return -1;
  let score=s.length;
  score+=(s.match(/\n/g)||[]).length*8;
  score+=(s.match(/https?:\/\/\S+/g)||[]).length*6;
  if(/[。！？!?)）】」』]$/.test(s))score+=8;
  if(/(?:…|\.\.\.)\s*(?:https?:\/\/\S+)?$/.test(s))score-=80;
  if(s.length<80)score-=20;
  return score;
}
function chooseFullerText(existing,candidate){
  const a=String(existing||""),b=String(candidate||"");
  return textQuality(b)>textQuality(a)?b:a;
}
function openDb(){return new Promise((resolve,reject)=>{const q=indexedDB.open("sanrioPostHelperDB",1);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getAll(){const db=await openDb();return new Promise((resolve,reject)=>{const q=db.transaction("popularPosts").objectStore("popularPosts").getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>reject(q.error)})}
async function putMany(items){if(!items.length)return;const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction("popularPosts","readwrite"),s=tx.objectStore("popularPosts");items.forEach(x=>s.put(x));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function toB64(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));let binary="";for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));return btoa(binary)}
async function sendChunk(url,token,items){
  const fd=new FormData();fd.append("payload_b64",toB64({items}));
  const r=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+token},body:fd,cache:"no-store"});
  if(r.ok)return {ok:items.length,failed:[]};
  const body=await r.text();
  if(items.length===1)return {ok:0,failed:[{id:items[0].postId||items[0].id,status:r.status,body:body.slice(0,120)}]};
  const mid=Math.ceil(items.length/2),a=await sendChunk(url,token,items.slice(0,mid)),b=await sendChunk(url,token,items.slice(mid));
  return {ok:a.ok+b.ok,failed:a.failed.concat(b.failed)};
}
async function refreshArchiveFiles(){
  parsedTweets=[];parsedNotes=[];$("repairText").disabled=true;
  const tf=$("tweetFile").files&&$("tweetFile").files[0];
  const nf=$("noteFile").files&&$("noteFile").files[0];
  if(!tf){$("textStatus").textContent="まず tweets.js を選んでください。";return}
  try{
    parsedTweets=parseTweetJs(await tf.text());
    if(nf)parsedNotes=parseNoteJs(await nf.text());
    const m=attachNoteFullText(parsedTweets,parsedNotes);
    $("textStatus").textContent="読込完了：通常投稿 "+parsedTweets.length.toLocaleString()+"件 / 長文データ "+parsedNotes.length.toLocaleString()+"件 / 長文一致 "+m.matched.toLocaleString()+"件";
    $("repairText").disabled=!parsedTweets.length;
    say("tweets.js："+parsedTweets.length+"投稿");
    if(nf)say("note-tweet.js："+parsedNotes.length+"件 / 一致 "+m.matched+"件");
    else say("note-tweet.js 未選択：長文投稿は tweets.js 側の短い本文のままです");
  }catch(err){$("textStatus").textContent="読込失敗："+err.message;say("エラー："+err.message)}
}
$("tweetFile").onchange=refreshArchiveFiles;
$("noteFile").onchange=refreshArchiveFiles;
$("repairText").onclick=async()=>{
  const btn=$("repairText");btn.disabled=true;
  try{
    const token=$("key").value.trim();if(!token)throw new Error("同期キーが空です");
    localStorage.setItem(KEY,token);
    const local=await getAll(),byPost=new Map();
    for(const item of local){const id=localPostId(item);if(id)byPost.set(id,item)}
    const updates=[];let matched=0,improved=0,protectedCount=0,unchanged=0,missing=0;
    for(const t of parsedTweets){
      const id=archiveTweetId(t),candidate=String(t.__fullText||t.full_text||t.text||"");
      if(!id||!candidate)continue;
      const old=byPost.get(id);
      if(!old){missing++;continue}
      matched++;
      const prev=String(old.text||""),full=chooseFullerText(prev,candidate);
      if(full===prev){
        if(candidate!==prev)protectedCount++;else unchanged++;
        continue;
      }
      const next={...old,text:full,title:old.title||full.replace(/\s+/g," ").slice(0,60),updatedAt:new Date().toISOString()};
      improved++;
      updates.push(next);
      byPost.set(id,next);
    }
    say("照合："+matched+"投稿 / 本文改善 "+improved+" / 短い本文から保護 "+protectedCount+" / 変更なし "+unchanged+" / DB未一致 "+missing);
    if(!updates.length){
      bar.value=1;
      $("textStatus").textContent="確認完了：本文の改善対象はありません。保存済みの長い本文は保持しました。";
      return;
    }
    await putMany(updates);
    say("端末本文修復："+updates.length+"投稿（本文改善 "+improved+"）");
    const pushUrl=$("api").value.replace(/archive-media-batch\.php(?:\?.*)?$/,"api2580.php?action=push");
    let ok=0,failed=[];
    for(let i=0;i<updates.length;i+=5){
      const part=updates.slice(i,i+5),rr=await sendChunk(pushUrl,token,part);
      ok+=rr.ok;failed=failed.concat(rr.failed);
      bar.value=Math.min(1,(i+part.length)/updates.length);
      if(i===0||i+part.length>=updates.length||((i+part.length)%100)<5)say("クラウド同期 "+Math.min(i+part.length,updates.length)+"/"+updates.length);
    }
    $("textStatus").innerHTML='<span class="ok">本文改善完了：'+ok+'投稿</span> / 失敗 '+failed.length+'。';
    say("クラウド反映：成功 "+ok+" / 失敗 "+failed.length);
    if(failed.length)say("失敗例："+failed.slice(0,10).map(x=>x.id+" HTTP"+x.status).join(", "));
  }catch(err){$("textStatus").textContent="失敗："+err.message;say("エラー："+err.message)}
  finally{btn.disabled=false}
};
function urlList(v){return Array.isArray(v)?[...new Set(v.filter(x=>typeof x==="string"&&/^https?:\/\//i.test(x)))]:[]}
$("repairMedia").onclick=async()=>{
  const btn=$("repairMedia");btn.disabled=true;
  try{
    const token=$("key").value.trim();if(!token)throw new Error("同期キーが空です");
    localStorage.setItem(KEY,token);
    const local=await getAll(),posts=local.map(x=>({...x,images:urlList(x.images),videos:urlList(x.videos)})).filter(x=>x.images.length||x.videos.length);
    const pushUrl=$("api").value.replace(/archive-media-batch\.php(?:\?.*)?$/,"api2580.php?action=push");
    let ok=0,failed=[];
    for(let i=0;i<posts.length;i+=5){
      const part=posts.slice(i,i+5),rr=await sendChunk(pushUrl,token,part);
      ok+=rr.ok;failed=failed.concat(rr.failed);bar.value=Math.min(1,(i+part.length)/posts.length);
    }
    say("画像URL同期完了：成功 "+ok+" / 失敗 "+failed.length);
  }catch(err){say("画像URL同期失敗："+err.message)}
  finally{btn.disabled=false}
};
})();
</script>
</body>
</html>
