<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Xアーカイブ画像URL再同期 3090</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;background:#fff7fb;color:#352936}
.card{background:#fff;border:1px solid #eadce7;border-radius:16px;padding:1rem;margin:1rem 0}
button{padding:.8rem 1.1rem;border-radius:10px;border:1px solid #d6bfd0;background:#fff;cursor:pointer}
.primary{background:#e85d9e;color:#fff;border:0;font-weight:700}
button:disabled{opacity:.5}
input{width:95%;padding:.6rem}
label{display:block;margin:.7rem 0}
progress{width:100%;margin:1rem 0}
#log{white-space:pre-wrap;background:#271f29;color:#fff;padding:1rem;border-radius:10px;min-height:9rem;max-height:330px;overflow:auto}
.muted{color:#756775}.build{font-size:.85rem;font-weight:700;color:#8a7484}
</style>
</head>
<body>
<main>
<h1>Xアーカイブ画像URL再同期</h1>
<p class="build">BUILD 3090</p>
<p class="muted">写真・動画そのものは再アップロードしません。前回取り込み済みのPCブラウザ内データから、画像URLだけをロリポップへ再送します。</p>
<section class="card">
<button id="run" class="primary" type="button">画像URLだけ再同期</button>
<p id="status" class="muted">前回取り込みを行った同じPC・同じChromeで実行してください。</p>
</section>
<section class="card">
<label>API URL<input id="api" value="https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/archive-media-batch.php"></label>
<label>同期キー<input id="key" type="password"></label>
</section>
<progress id="bar" value="0" max="1"></progress>
<pre id="log">BUILD 3090 準備完了。</pre>
</main>
<script>
(function(){
"use strict";
var run=document.getElementById("run");
var status=document.getElementById("status");
var api=document.getElementById("api");
var key=document.getElementById("key");
var bar=document.getElementById("bar");
var log=document.getElementById("log");
var KEY="sanrioCloudSyncKey";
key.value=localStorage.getItem(KEY)||"";
function say(s){log.textContent+="\n"+s;log.scrollTop=log.scrollHeight}
function openDb(){return new Promise(function(resolve,reject){var q=indexedDB.open("sanrioPostHelperDB",1);q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}})}
async function getAll(){var db=await openDb();return new Promise(function(resolve,reject){var q=db.transaction("popularPosts").objectStore("popularPosts").getAll();q.onsuccess=function(){resolve(q.result||[])};q.onerror=function(){reject(q.error)}})}
function urlList(v){if(!Array.isArray(v))return [];var out=[];for(var i=0;i<v.length;i++){var x=v[i];if(typeof x==="string"&&(x.indexOf("https://")===0||x.indexOf("http://")===0)&&out.indexOf(x)<0)out.push(x)}return out}
function toB64(obj){var bytes=new TextEncoder().encode(JSON.stringify(obj));var binary="";for(var i=0;i<bytes.length;i+=32768){binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768))}return btoa(binary)}
async function sendChunk(url,token,items){
  var fd=new FormData();fd.append("payload_b64",toB64({items:items}));
  var r=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+token},body:fd,cache:"no-store"});
  if(r.ok)return {ok:items.length,failed:[]};
  var body=await r.text();
  if(items.length===1)return {ok:0,failed:[{id:items[0].postId||items[0].id,status:r.status,body:body.substring(0,120)}]};
  var mid=Math.ceil(items.length/2);
  var a=await sendChunk(url,token,items.slice(0,mid));
  var b=await sendChunk(url,token,items.slice(mid));
  return {ok:a.ok+b.ok,failed:a.failed.concat(b.failed)}
}
run.onclick=async function(){
  run.disabled=true;status.textContent="PC内の画像URLを確認中…";
  try{
    var token=key.value.trim();if(!token)throw new Error("同期キーが空です");
    localStorage.setItem(KEY,token);
    var local=await getAll();
    var posts=[];
    for(var i=0;i<local.length;i++){
      var x=local[i],images=urlList(x.images),videos=urlList(x.videos);
      if(images.length||videos.length)posts.push(Object.assign({},x,{images:images,videos:videos}));
    }
    var urlCount=0;for(var j=0;j<posts.length;j++)urlCount+=posts[j].images.length+posts[j].videos.length;
    say("PC内投稿 "+local.length+"件");
    say("メディア付き "+posts.length+"投稿 / URL "+urlCount+"件");
    if(!posts.length)throw new Error("このChromeの端末DBに画像URLがありません");
    var pushUrl=api.value.replace("archive-media-batch.php","api2580.php?action=push");
    var ok=0,failed=[];
    for(var p=0;p<posts.length;p+=5){
      var part=posts.slice(p,p+5);
      var rr=await sendChunk(pushUrl,token,part);
      ok+=rr.ok;failed=failed.concat(rr.failed);
      bar.value=Math.min(1,(p+part.length)/posts.length);
      if(p===0||p+part.length>=posts.length||((p+part.length)%100)<5)say("URL同期 "+Math.min(p+part.length,posts.length)+"/"+posts.length);
    }
    say("完了：成功 "+ok+"件 / 失敗 "+failed.length+"件");
    if(failed.length)say("失敗例 "+failed.slice(0,10).map(function(x){return String(x.id)+" HTTP"+x.status}).join(", "));
    status.textContent="完了：成功 "+ok+"件 / 失敗 "+failed.length+"件。iPhoneで「クラウドから統合」を押してください。";
  }catch(e){
    say("エラー："+(e&&e.message?e.message:String(e)));
    status.textContent="失敗："+(e&&e.message?e.message:String(e));
  }finally{run.disabled=false}
};
})();
</script>
</body>
</html>
