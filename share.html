<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#fff7fb">
<title>Sanrio Post Helper 共有確認</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7fb;color:#29252d;margin:0;padding:24px}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #eadfe6;border-radius:18px;padding:20px;line-height:1.7}
</style>
</head>
<body><div class="box"><h1>共有ページを開いています…</h1><p id="msg">数秒お待ちください。</p></div>
<script>
(()=>{
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const query=new URLSearchParams(location.search);
 const token=hash.get('token')||query.get('token')||'';
 const msg=document.getElementById('msg');
 if(!/^[a-f0-9]{64}$/i.test(token)){
   msg.textContent='リンクが正しくありません。Sanrio Post Helperから共有リンクを作り直してください。';
   return;
 }
 const target='https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/share.php?token='+encodeURIComponent(token);
 location.replace(target);
})();
</script></body></html>
