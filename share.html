<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>期限付き確認ページ | Sanrio Post Helper</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29252d;background:#fff7fb}
*{box-sizing:border-box}
body{margin:0;padding:20px 14px 48px}
main{max-width:760px;margin:0 auto}
header,.post,.state{background:#fff;border:1px solid #e9dfe6;border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 4px 18px #33203308}
h1{font-size:22px;margin:0 0 8px}
h2{font-size:18px;line-height:1.45;margin:0 0 10px}
p{line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.note,.meta{color:#77717a;font-size:13px}
.badge{display:inline-block;background:#f6e1eb;color:#7c4560;padding:5px 10px;border-radius:99px;font-size:12px;margin-bottom:10px}
.post{padding:18px}
.post-text{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.media img{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;background:#f5f2f4;border-radius:12px}
.media a{color:#5548a7;overflow-wrap:anywhere}
.pick-role{margin:10px 0 4px;font-size:12px;font-weight:700;color:#7c4560;background:#f6e1eb;border-radius:99px;display:inline-block;padding:5px 10px}
.pick-reason{margin:5px 0 10px;padding:9px 11px;border-radius:10px;background:#f7f3f6;color:#51414e;font-size:13px;line-height:1.5}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;color:#77717a;font-size:13px}
.freshness-review{margin:8px 0;padding:9px 11px;border:1px solid #e8d18c;border-radius:10px;background:#fff7df;color:#795b20;font-size:12px;font-weight:700;line-height:1.5}
.metrics span{padding:5px 9px;border-radius:99px;background:#f7f3f6}
#search{width:100%;padding:12px 14px;border:1px solid #ddd2dc;border-radius:12px;font-size:16px;margin-top:10px}
@media(max-width:520px){body{padding:12px 10px 32px}.post,header,.state{padding:14px}.media{grid-template-columns:1fr 1fr}h1{font-size:20px}}

.post-text.is-collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.text-toggle{display:inline-flex;align-items:center;margin-top:4px;padding:7px 12px;border:0;border-radius:999px;background:#f6e1eb;color:#7c4560;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.affiliate-actions{margin:12px 0;padding:12px;border:1px solid #efd7e3;border-radius:14px;background:#fff9fc}
.affiliate-title{margin:0 0 9px;font-size:13px;font-weight:700;color:#7c4560}
.affiliate-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.affiliate-open,.affiliate-copy{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;text-decoration:none}
.affiliate-open{flex:1;background:#f6e1eb;color:#382538}
.affiliate-copy{border:1px solid #e9dfe6;background:#fff;color:#51414e;cursor:pointer}
.product-group{margin:0 0 14px;padding:14px;border:1px solid #d8bfd0;border-radius:18px;background:#fff8fc}
.product-group-head{margin:0 0 10px}
.product-group-title{margin:0 0 4px;font-size:15px;color:#7c4560}
.product-group-note{margin:0;color:#77717a;font-size:12px;line-height:1.5}
.grouped-post{margin:10px 0 0;box-shadow:none}
@media(max-width:520px){.affiliate-row{align-items:stretch}.affiliate-open,.affiliate-copy{font-size:13px;padding:8px 10px}}

</style>
</head>
<body>
<main>
<header>
<span class="badge">Sanrio Post Helper</span>
<h1>期限付き確認ページ</h1>
<p id="intro" class="note">確認用データを読み込んでいます…</p>
<input id="search" type="search" placeholder="投稿文から検索" aria-label="投稿文から検索" hidden>
</header>
<div id="state" class="state" role="status" aria-live="polite">読み込み中…</div>
<section id="posts" aria-label="投稿候補"></section>
</main>
<script>
(()=> {
"use strict";
const API="https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/archive-media-batch.php";
const params=new URLSearchParams(location.search);
const token=new URLSearchParams(location.hash.replace(/^#/,"")).get("token")||params.get("token")||"";
const state=document.getElementById("state"),root=document.getElementById("posts"),intro=document.getElementById("intro"),search=document.getElementById("search");
let records=[];
const add=(parent,tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);parent.appendChild(el);return el};
const metric=(label,value)=>{if(value===null||value===undefined||value==="")return null;const n=Number(String(value).replace(/,/g,""));return label+" "+(Number.isFinite(n)?n.toLocaleString("ja-JP"):String(value))};
const rateMetric=(label,value,total)=>{if(value===null||value===undefined||value===""||total===null||total===undefined||total==="")return null;const n=Number(String(value).replace(/,/g,"")),d=Number(String(total).replace(/,/g,""));if(!Number.isFinite(n)||!Number.isFinite(d)||n<0||d<=0)return null;const pct=n/d*100;return label+" "+pct.toFixed(pct>=10?1:2)+"%"};

function ageDays(value){
 const raw=String(value||"");
 const oldAge=raw.match(/([0-9]+) *日前/);
 if(oldAge)return Number(oldAge[1]);
 const time=Date.parse(raw);
 return Number.isFinite(time)?Math.max(0,Math.floor((Date.now()-time)/86400000)):null;
}
function freshnessReviewReason(p){
 const age=ageDays(p.postedAt);
 if(age===null)return "";
 const text=String(p.title||"")+" "+String(p.text||"");
 const timeSensitive=/(?:発売|予約|販売|開催|受付|入荷|受注|順次|登場|再販|開始)/.test(text);
 let period=text.match(/(20[0-9]{2})年 *([0-9]{1,2})月/);
 if(!period)period=text.match(/(20[0-9]{2})[-.]([0-9]{1,2})/);
 let year=period?Number(period[1]):0;
 let month=period?Number(period[2]):0;
 if(!period){
  const monthMatch=text.match(/(^|[^0-9])([0-9]{1,2})月/);
  const raw=String(p.postedAt||"");
  let posted=Date.parse(raw);
  if(!Number.isFinite(posted)){
   const oldDate=raw.match(/([0-9]{4})\/([0-9]{1,2})/);
   if(oldDate)posted=new Date(Number(oldDate[1]),Number(oldDate[2])-1,1).getTime();
  }
  if(monthMatch&&Number.isFinite(posted)){
   const postDate=new Date(posted);
   month=Number(monthMatch[2]);
   year=postDate.getFullYear()+(month<postDate.getMonth()+1?1:0);
  }
 }
 if(timeSensitive&&year&&month>=1&&month<=12){
  const now=new Date();
  if(year*12+month < now.getFullYear()*12+now.getMonth()+1){
   return year+"年"+month+"月の時期は過ぎています。現在の販売・開催状況を確認してください。";
  }
  if(age>=30)return "投稿内の"+year+"年"+month+"月という時期の最新状況を確認してください。";
 }
 if(age>=90)return "投稿から90日以上経過しています。商品・販売・開催状況を確認してください。";
 if(age>=45&&/(?:新商品|商品|グッズ|フィギュア|書籍|雑貨|文房具|発売|販売|取扱店舗|価格|税込|[0-9,]+円|ショップ|予約)/.test(text)){
  return "価格・販売状況などが変わっている可能性があります。公式情報を確認してください。";
 }
 if(age>=30&&timeSensitive)return "投稿内の日付・発売・開催情報の最新状況を確認してください。";
 return "";
}
function unpackPost(p){
 const raw=String(p.text||"");
 const marker="SPH_META_V1:";
 if(!raw.startsWith(marker))return p;
 const end=raw.indexOf("\n");
 if(end<marker.length||end>700)return p;
 try{
  const meta=JSON.parse(raw.slice(marker.length,end));
  if(!meta||typeof meta!=="object"||typeof meta.role!=="string"||typeof meta.reason!=="string")return p;
  return {...p,text:raw.slice(end+1),pickRole:meta.role.slice(0,40),pickReason:meta.reason.slice(0,320)};
 }catch(_){return p}
}

function extractUrls(text){
 const source=String(text||"");
 const pattern=/https?:\/\/[^\s<>「」『』【】]+/gi,trail=/[.,!?;:。、，！？；：：）)】」』]+$/;
 const found=[];let m;
 while((m=pattern.exec(source))){
  let href=m[0];
  while(trail.test(href))href=href.slice(0,-1);
  try{const u=new URL(href);if(u.protocol==="https:")found.push(u)}catch(_){}
 }
 return found;
}
function affiliateKind(url){
 const host=url.hostname.toLowerCase().replace(/^www\./,"");
 if(/(^|\.)(?:amazon\.(?:co\.jp|com|co\.uk|de|fr|it|es|ca|com\.au|in|com\.br)|amzn\.to|amzn\.asia)$/.test(host))return "Amazon";
 if(host==="hb.afl.rakuten.co.jp"||host==="r10.to"||host==="rakuten.co.jp"||host.endsWith(".rakuten.co.jp"))return "楽天";
 return "";
}
function collectAffiliateLinks(text){
 const links=[],seen=new Set();
 for(const url of extractUrls(text)){
  const shop=affiliateKind(url);if(!shop)continue;
  const key=shop+"|"+url.href;
  if(seen.has(key))continue;
  seen.add(key);links.push({shop,href:url.href});
 }
 return links;
}
function renderAffiliateActions(parent,text){
 const links=collectAffiliateLinks(text);
 if(!links.length)return;
 const box=add(parent,"section","affiliate-actions");
 add(box,"p","affiliate-title","商品リンク（在庫・販売状況を確認）");
 links.forEach((item,index)=>{
  const row=add(box,"div","affiliate-row");
  const open=add(row,"a","affiliate-open",item.shop+"で確認 ↗"+(links.filter(x=>x.shop===item.shop).length>1?" "+(links.filter(x=>x.shop===item.shop).indexOf(item)+1):""));
  open.href=item.href;open.target="_blank";open.rel="sponsored nofollow noopener noreferrer";
  const copy=add(row,"button","affiliate-copy","リンクをコピー");
  copy.type="button";
  copy.addEventListener("click",async()=>{
   try{
    if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(item.href);
    else{
     const input=document.createElement("textarea");input.value=item.href;input.style.position="fixed";input.style.opacity="0";document.body.appendChild(input);input.select();
     const ok=document.execCommand("copy");input.remove();if(!ok)throw new Error("copy");
    }
    copy.textContent="コピーしました";
    setTimeout(()=>{copy.textContent="リンクをコピー"},1800);
   }catch(_){copy.textContent="コピーできませんでした";setTimeout(()=>{copy.textContent="リンクをコピー"},1800)}
  });
 });
}
function addLinkedPostText(parent,text){
 const paragraph=add(parent,"p","post-text","");
 const source=String(text||"");
 const urlPattern=/https?:\/\/[^\s<>「」『』【】]+/gi;
 const trailingPunctuation=/[.,!?;:。、，！？；：：）)】」』]+$/;
 let cursor=0,match;
 while((match=urlPattern.exec(source))){
  let href=match[0];
  let suffix="";
  while(trailingPunctuation.test(href)){
   const char=href.slice(-1);
   href=href.slice(0,-1);
   suffix=char+suffix;
  }
  paragraph.appendChild(document.createTextNode(source.slice(cursor,match.index)));
  if(href){
   try{
    const url=new URL(href);
    if(url.protocol==="https:"){
     const link=add(paragraph,"a","post-link",href);
     link.href=url.href;link.target="_blank";
     link.rel=affiliateKind(url)?"sponsored nofollow noopener noreferrer":"noopener noreferrer";
    }else paragraph.appendChild(document.createTextNode(href));
   }catch(_){paragraph.appendChild(document.createTextNode(href))}
  }
  paragraph.appendChild(document.createTextNode(suffix));
  cursor=match.index+match[0].length;
 }
 paragraph.appendChild(document.createTextNode(source.slice(cursor)));
 return paragraph;
}
function postProductKeys(p){
 const text=String(p.title||"")+" "+String(p.text||"");
 const keys=new Set();
 const sku=/\b[A-Z]{2,8}[-_ ]?\d{3,5}(?:[-_ ]?[A-Z0-9]{1,6})?\b/gi;let m;
 while((m=sku.exec(text)))keys.add("sku:"+m[0].toUpperCase().replace(/[-_ ]/g,""));
 for(const url of extractUrls(text)){
  const host=url.hostname.toLowerCase().replace(/^www\./,""),path=url.pathname;
  const asin=path.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})(?:\/|$)/i);
  if(asin)keys.add("asin:"+asin[1].toUpperCase());
  if(host==="item.rakuten.co.jp"){
   const item=path.match(/^\/([^/]+)\/([^/]+)/);
   if(item)keys.add("rakuten:"+item[1].toLowerCase()+"/"+item[2].toLowerCase());
  }
 }
 return keys;
}
function normalizedPostTitle(p){
 return String(p.title||"").toLocaleLowerCase()
  .replace(/https?:\/\/\S+/gi," ").replace(/#[^\s#]+/g," ")
  .replace(/[【】「」『』［］\[\]()（）]/g," ")
  .replace(/[\s\p{P}\p{S}]+/gu,"").trim();
}
function titleSimilarity(a,b){
 if(!a||!b||Math.min(a.length,b.length)<8)return 0;
 if(Math.min(a.length,b.length)/Math.max(a.length,b.length)<0.72)return 0;
 const grams=s=>{const out=new Set();for(let i=0;i<s.length-1;i++)out.add(s.slice(i,i+2));return out};
 const x=grams(a),y=grams(b);let overlap=0;x.forEach(g=>{if(y.has(g))overlap++});
 return overlap/(x.size+y.size-overlap||1);
}
function sameProductCandidate(a,b){
 const ak=postProductKeys(a),bk=postProductKeys(b);
 for(const k of ak)if(bk.has(k))return true;
 const x=normalizedPostTitle(a),y=normalizedPostTitle(b);
 return x===y&&x.length>=8||titleSimilarity(x,y)>=0.82;
}
function groupProductCandidates(rows){
 const groups=[];
 rows.forEach(post=>{
  const group=groups.find(g=>g.posts.some(existing=>sameProductCandidate(existing,post)));
  if(group)group.posts.push(post);else groups.push({posts:[post]});
 });
 return groups;
}
function renderPostCard(parent,p,grouped){
 const card=add(parent,"article",grouped?"post grouped-post":"post");
 add(card,"h2","",p.title||"投稿");
 add(card,"div","meta",p.postedAt||"");
 if(p.pickRole)add(card,"div","pick-role",p.pickRole);
 if(p.pickReason)add(card,"p","pick-reason","選定理由："+p.pickReason);
 const review=freshnessReviewReason(p);
 if(review)add(card,"p","freshness-review","⚠️ "+review);
 if(p.text){
  const paragraph=addLinkedPostText(card,p.text);
  if(String(p.text).length>260){
   paragraph.classList.add("is-collapsed");
   const toggle=add(card,"button","text-toggle","続きを読む");
   toggle.type="button";toggle.setAttribute("aria-expanded","false");
   toggle.addEventListener("click",()=>{
    const expanded=toggle.getAttribute("aria-expanded")==="true";
    toggle.setAttribute("aria-expanded",String(!expanded));
    paragraph.classList.toggle("is-collapsed",expanded);
    toggle.textContent=expanded?"続きを読む":"閉じる";
   });
  }
  renderAffiliateActions(card,p.text);
 }
 if(p.xUrl){try{const x=new URL(p.xUrl);const host=x.hostname.toLowerCase().replace(/^www\./,"");if(x.protocol==="https:"&&["x.com","twitter.com"].includes(host)){const postId=x.pathname.match(/\/status\/(\d+)/)?.[1];const a=add(card,"a","","Xアプリで開く");a.href=postId?"https://x.com/i/status/"+postId:x.href;a.target="_blank";a.rel="noopener noreferrer"}}catch(e){}}
 const stats=[metric("表示",p.impressions),metric("いいね",p.likes),metric("保存",p.bookmarks),rateMetric("保存率",p.bookmarks,p.impressions)||"保存率 データなし",metric("クリック",p.clicks)].filter(Boolean);
 if(stats.length){const m=add(card,"div","metrics");stats.forEach(s=>add(m,"span","",s))}
 const media=[];
 (Array.isArray(p.images)?p.images:[]).forEach(src=>media.push({src,type:"image"}));
 (Array.isArray(p.videos)?p.videos:[]).forEach(src=>media.push({src,type:"video"}));
 if(media.length){
  const grid=add(card,"div","media");
  media.forEach(item=>{
   let url;
   try{url=new URL(item.src);if(url.protocol!=="https:")return}catch(e){return}
   if(item.type==="image"){
    const img=add(grid,"img","","");img.alt="投稿写真";img.loading="lazy";
    img.onerror=()=>{if(img.dataset.proxyTried)return;img.dataset.proxyTried="1";const proxy=new URL(API);proxy.searchParams.set("action","shared_file");proxy.searchParams.set("token",token);proxy.searchParams.set("url",item.src);img.src=proxy.href};
    img.src=item.src;
   }else{
    const a=add(grid,"a","","動画を開く");a.href=url.href;a.target="_blank";a.rel="noopener noreferrer";
   }
  });
 }
 return card;
}
function render(){
 const q=search.value.trim().toLocaleLowerCase();
 root.replaceChildren();
 const rows=records.filter(p=>!q||String(p.title+" "+p.text).toLocaleLowerCase().includes(q));
 const groups=groupProductCandidates(rows);
 groups.forEach(group=>{
  if(group.posts.length>1){
   const section=add(root,"section","product-group");
   const head=add(section,"div","product-group-head");
   add(head,"h2","product-group-title","同じ商品かも：投稿候補"+group.posts.length+"件");
   add(head,"p","product-group-note","タイトル・商品コード・商品リンクが近い投稿をまとめています。各投稿を見比べてください。");
   group.posts.forEach(p=>renderPostCard(section,p,true));
  }else renderPostCard(root,group.posts[0],false);
 });
 if(!rows.length)add(root,"p","state","一致する投稿はありません。");
}

async function start(){
 if(!/^[a-f0-9]{64}$/i.test(token)){state.textContent="リンクが正しくありません。アプリで確認用リンクを作り直してください。";return}
 try{
  const u=new URL(API);u.searchParams.set("action","shared");u.searchParams.set("token",token);
  const response=await fetch(u.href,{cache:"no-store"});
  const data=await response.json();
  if(response.status===410){state.textContent="このリンクの有効期限が切れました。アプリで新しいリンクを作ってください。";return}
  if(!response.ok||!data.ok||!data.snapshot)throw new Error(data.error||"共有データを読み込めません");
  records=Array.isArray(data.snapshot.posts)?data.snapshot.posts.map(unpackPost):[];
  intro.textContent=(data.snapshot.scope||"投稿")+ " "+records.length+"件を表示中。リンクは "+new Date(data.expiresAt).toLocaleString("ja-JP")+" まで有効です。";
  state.hidden=true;search.hidden=false;search.addEventListener("input",render);render();
 }catch(error){state.textContent="共有データを読み込めませんでした。リンクの期限切れ、またはサーバー未更新の可能性があります。"}
}
start();
})();
</script>
</body>
</html>
