<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>Sanrio Post Helper</title>
<link rel="stylesheet" href="./styles.css?v=20260921-1745">
</head>
<body>
<main class="app">
<header>
<div class="badge">Sanrio fan info</div>
<h1>今日の再利用候補</h1>
<p>開いたらすぐ、今日使う候補を確認。</p>
</header>

<section id="archive">
<section class="card today-card">
<div class="today-head">
<div>
<h2 class="section-title">今日の候補</h2>
<p class="backup-note">30日以上あけた投稿から、反応と収益性を見て3件自動選定します。</p>
</div>
</div>
<div id="todayList" class="today-list"></div>
</section>


<div class="archive-tools">
<input id="archiveSearch" type="search" placeholder="商品名・投稿文から検索">
<div class="filter-row">
<button class="filter-btn active" data-filter="all">すべて</button>
<button class="filter-btn" data-filter="ready">30日以上未投稿</button>
<button class="filter-btn" data-filter="affiliate">アフィリエイトあり</button>
<button class="filter-btn" data-filter="amazon">Amazonあり</button>
<button class="filter-btn" data-filter="rakuten">楽天あり</button>
<button class="filter-btn" data-filter="both">Amazon＋楽天</button>
</div>
<div class="sort-row">
<span class="sort-label">並び順</span>
<button class="sort-btn active" data-sort="newest">新しい順</button>
<button class="sort-btn" data-sort="impressions">表示順</button>
<button class="sort-btn" data-sort="likes">いいね順</button>
<button class="sort-btn" data-sort="bookmarks">保存順</button>
<button class="sort-btn" data-sort="clicks">クリック順</button>
</div>
</div>

<details class="management">
<summary>管理を開く</summary>
<div class="management-body">
<section class="card form-card">
<div class="form-title-row">
<h2 id="archiveFormTitle" class="section-title">人気投稿を保存</h2>
<button id="cancelEdit" class="small-btn hidden" type="button">修正をやめる</button>
</div>
<label>写真（最大4枚）
<input id="archiveImage" type="file" accept="image/*" multiple>
</label>
<div id="archivePreviewGrid" class="preview-grid"></div>
<label>商品名<input id="archiveTitle" type="text" placeholder="例：サンリオ 金ピカ根付ストラップ"></label>
<label>過去のX投稿文<textarea id="archiveText" rows="7" placeholder="反応が良かった投稿文をそのまま保存"></textarea></label>
<label>Amazon URL<input id="archiveAmazon" type="url" placeholder="https://..."></label>
<label>楽天 URL<input id="archiveRakuten" type="url" placeholder="https://..."></label>
<div class="metrics-grid">
<label>表示数<input id="archiveImpressions" type="text" inputmode="numeric" placeholder="例：1.8万"></label>
<label>いいね<input id="archiveLikes" type="text" inputmode="numeric" placeholder="例：320"></label>
<label>保存<input id="archiveBookmarks" type="text" inputmode="numeric" placeholder="例：45"></label>
</div>
<label>メモ<input id="archiveMemo" type="text" placeholder="例：再販時に反応良かった"></label>
<button id="saveArchive" class="primary">人気投稿に保存</button>
</section>

<section class="card analytics-import-card">
<div>
<h2 class="section-title">X分析CSVを読み込む</h2>
<p class="backup-note">Xの「ポスト別アナリティクスCSV」を選ぶと、投稿文・投稿日・Xリンク・表示数・いいね・保存数などをまとめて登録します。</p>
</div>
<label class="primary analytics-import-button">CSVを選んで一括登録
<input id="importAnalyticsCsv" type="file" accept=".csv,text/csv" hidden>
</label>
<p id="analyticsImportStatus" class="analytics-import-status"></p>
</section>

<section class="card backup-card">
<h2 class="section-title">バックアップ</h2>
<p class="backup-note">保存した人気投稿・写真をまとめて書き出し／復元できます。</p>
<div class="backup-actions">
<button id="exportBackup" class="small-btn">バックアップ保存</button>
<label class="small-btn import-label">バックアップ読込
<input id="importBackup" type="file" accept="application/json,.json" hidden>
</label>
</div>
</section>


</div>
</details>

<section id="archiveList" class="archive-list"></section>
</section>

<p class="note">保存データと写真はこのiPhone内だけに保存。GitHubにはアップロードしません。</p>
</main>

<div id="imageModal" class="modal hidden" role="dialog" aria-modal="true">
<div class="modal-bar">
<button id="closeModal" class="modal-close">閉じる</button>
<div id="modalCount" class="modal-count"></div>
</div>
<div id="modalImages" class="modal-images"></div>
<p class="modal-help">画像を長押しすると、写真へ保存・コピー・共有できます。</p>
</div>

<script src="./app.js?v=20260921-1745"></script>
</body>
</html>
