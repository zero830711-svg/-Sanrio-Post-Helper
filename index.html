<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>Sanrio Post Helper</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
<header>
<div class="badge">Sanrio fan info</div>
<h1>人気グッズ再利用ツール</h1>
<p>スマホだけで「保存 → 呼び出し → Xへ貼り付け」。</p>
</header>

<nav class="tabs">
<button class="tab active" data-tab="archive">人気投稿</button>
<button class="tab" data-tab="create">作る</button>
</nav>

<section id="create" class="tab-panel">
<section class="card form-card">
<label>商品・話題名<input id="title" type="text" placeholder="例：ハローキティ ○○コレクション"></label>
<label>元ネタ / 過去投稿<textarea id="source" rows="7" placeholder="過去のX投稿、商品説明、メモなどを貼り付け"></textarea></label>
<label>Amazon URL<input id="amazon" type="url" placeholder="https://..."></label>
<label>楽天 URL<input id="rakuten" type="url" placeholder="https://..."></label>
<button id="generate" class="primary">3種類まとめて作る</button>
</section>

<section class="outputs">
<article class="card"><div class="head"><h2>X</h2><button class="copy" data-target="xOutput">コピー</button></div><textarea id="xOutput" rows="8" readonly></textarea></article>
<article class="card"><div class="head"><h2>Threads</h2><button class="copy" data-target="threadsOutput">コピー</button></div><textarea id="threadsOutput" rows="10" readonly></textarea></article>
<article class="card"><div class="head"><h2>WordPress</h2><button class="copy" data-target="blogOutput">コピー</button></div><textarea id="blogOutput" rows="16" readonly></textarea></article>
</section>
</section>

<section id="archive" class="tab-panel active">
<section class="card form-card">
<div class="form-title-row">
<h2 id="archiveFormTitle" class="section-title">人気投稿を保存</h2>
<button id="cancelEdit" class="small-btn hidden" type="button">修正をやめる</button>
</div>
<label>写真（最大4枚）
<input id="archiveImage" type="file" accept="image/*" multiple>
</label>
<div id="archivePreviewGrid" class="preview-grid"></div>
<label>商品名<input id="archiveTitle" type="text" placeholder="例：サンリオ 金ピカ根付ストラップ"></label>
<label>過去のX投稿文<textarea id="archiveText" rows="7" placeholder="反応が良かった投稿文をそのまま保存"></textarea></label>
<label>Amazon URL<input id="archiveAmazon" type="url" placeholder="https://..."></label>
<label>楽天 URL<input id="archiveRakuten" type="url" placeholder="https://..."></label>
<label>メモ<input id="archiveMemo" type="text" placeholder="例：1.8万表示 / いいね320"></label>
<button id="saveArchive" class="primary">人気投稿に保存</button>
</section>

<section class="card today-card">
<div class="today-head">
<div>
<h2 class="section-title">今日の候補</h2>
<p class="backup-note">30日以上未投稿の中から3件を自動表示します。</p>
</div>
<button id="pickToday" class="small-btn">候補を出す</button>
</div>
<div id="todayList" class="today-list"></div>
</section>

<div class="archive-tools">
<input id="archiveSearch" type="search" placeholder="商品名・投稿文から検索">
<div class="filter-row">
<button class="filter-btn active" data-filter="all">すべて</button>
<button class="filter-btn" data-filter="ready">30日以上未投稿</button>
</div>
</div>

<section class="card backup-card">
<h2 class="section-title">バックアップ</h2>
<p class="backup-note">保存した人気投稿・写真をまとめて書き出し／復元できます。</p>
<div class="backup-actions">
<button id="exportBackup" class="small-btn">バックアップ保存</button>
<label class="small-btn import-label">バックアップ読込
<input id="importBackup" type="file" accept="application/json,.json" hidden>
</label>
</div>
</section>

<section id="archiveList" class="archive-list"></section>
</section>

<p class="note">保存データと写真はこのiPhone内だけに保存。GitHubにはアップロードしません。</p>
</main>

<div id="imageModal" class="modal hidden" role="dialog" aria-modal="true">
<div class="modal-bar">
<button id="closeModal" class="modal-close">閉じる</button>
<div id="modalCount" class="modal-count"></div>
</div>
<div id="modalImages" class="modal-images"></div>
<p class="modal-help">画像を長押しすると、写真へ保存・コピー・共有できます。</p>
</div>

<script src="./app.js"></script>
</body>
</html>
