name: Audit priority URL responses 20261027
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-priority-url-responses-20261027.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Inspect priority published pages without edits
        run: |
          python3 - <<'PY'
          import importlib.util,re,urllib.request,urllib.error
          spec=importlib.util.spec_from_file_location('ed','scripts/publish-editorial-article.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);wp=m.WordPress()
          paths=['/','/goods/','/characters/','/product-details/','/sanrio-gashapon-2026-10/','/product-9a6fc7cee941175a/','/product-78f25ff51e11bf39/','/product-cb7a11c5c4de259a/','/product-249b0acc6e22806b/','/product-7c70d0b63e119069/']
          for pid in [274,272,280]:
            try: paths.append(wp.call('/wp/v2/posts/'+str(pid)+'?context=edit')['link'])
            except Exception as e: print('WPERROR',pid,type(e).__name__,flush=True)
          for path in paths:
            url=path if path.startswith('https:') else 'https://sanrio-fan.site'+path
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; SEO-audit/1.0)'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                h=resp.read(1500000).decode('utf-8','replace')
                robots=re.findall(r'<meta\b[^>]*name=["\'](?:robots|googlebot)["\'][^>]*>',h,re.I)
                canonical=re.findall(r'<link\b[^>]*rel=["\']canonical["\'][^>]*>',h,re.I)
                print('CHECK',url,'STATUS',resp.status,'FINAL',resp.url,'XROBOTS',resp.headers.get('X-Robots-Tag','none'),'ROBOTS',robots,'CANONICAL',canonical,flush=True)
            except urllib.error.HTTPError as e: print('CHECK',url,'HTTP',e.code,flush=True)
            except Exception as e: print('CHECK',url,'ERROR',type(e).__name__,str(e)[:120],flush=True)
          PY
