name: Publish Sanrio capsule-toy roundup
on:
  push:
    branches: [main]
    paths:
      - 'blog/gacha-roundups/publish-2026-sanrio-october.json'
      - 'scripts/prepare-gacha-roundup.py'
      - '.github/workflows/publish-gacha-roundup.yml'
permissions:
  contents: read
concurrency:
  group: sanrio-gacha-roundup-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate roundup publisher
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes lftp php-cli php-curl
          php -l scripts/resolve-gacha-affiliate.php
          python3 -m py_compile scripts/prepare-gacha-roundup.py scripts/publish-editorial-article.py scripts/update-home-gacha-shelf.py
          python3 -m json.tool blog/gacha-roundups/publish-2026-sanrio-october.json >/dev/null
      - name: Download private Rakuten configuration
        run: |
          set -euo pipefail
          umask 077
          roundup_tmp=$(mktemp -d "$RUNNER_TEMP/sanrio-roundup.XXXXXX")
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get config.php -o "$roundup_tmp/config.php"
          bye
          LFTP
          echo "GACHA_ROUNDUP_TMP=$roundup_tmp" >> "$GITHUB_ENV"
      - name: Resolve affiliate links and publish through WordPress REST API
        run: |
          set -euo pipefail
          python3 scripts/prepare-gacha-roundup.py \
            blog/gacha-roundups/publish-2026-sanrio-october.json \
            "$GACHA_ROUNDUP_TMP/config.php"
      - name: Refresh the homepage gacha shelf
        run: python3 scripts/update-home-gacha-shelf.py
      - name: Remove private temporary files
        if: always()
        run: |
          if [[ -n "${GACHA_ROUNDUP_TMP:-}" && -d "$GACHA_ROUNDUP_TMP" ]]; then
            rm -rf -- "$GACHA_ROUNDUP_TMP"
          fi
