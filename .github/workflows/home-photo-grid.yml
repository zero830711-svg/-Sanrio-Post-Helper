name: Home photo grid
on:
  push:
    branches: [main]
    paths:
      - scripts/update-home-photo-grid.py
      - .github/workflows/home-photo-grid.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-home-photo-grid
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANRIO_WP_USER: \${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: \${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate updater syntax
        run: python3 -m py_compile scripts/update-home-photo-grid.py
      - name: Update home page through WordPress REST API
        run: python3 scripts/update-home-photo-grid.py
