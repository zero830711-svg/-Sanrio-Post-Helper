name: Fix overseas tab cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-overseas-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump app shell cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('20261004-3434','20261004-3436')
          s=s.replace('アプリ版 2026.10.04-3433','アプリ版 2026.10.04-3436')
          p.write_text(s)
          p=Path('app.js')
          s=p.read_text().replace('const APP_VERSION="2026.10.04-3434";','const APP_VERSION="2026.10.04-3436";')
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'version':'2026.10.04-3436','updatedAt':'2026-10-04T13:35:00Z'},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit cache bump
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js version.json
          git commit -m "Fix overseas tab cache loading"
          git push
