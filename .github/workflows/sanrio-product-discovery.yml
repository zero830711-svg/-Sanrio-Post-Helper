name: Sanrio product discovery
on:
  push:
    branches: [main]
    paths:
      - scripts/build-product-directory.py
      - scripts/build-character-product-pages.py
      - scripts/update-character-navigation.py
      - blog/tests/test_product_directory.py
      - .github/workflows/sanrio-product-discovery.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=読み取り確認 / apply=分類と一覧を更新'
        required: true
        default: check
        type: choice
        options: [check, apply]
permissions:
  contents: read
concurrency:
  group: sanrio-product-discovery
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s blog/tests -p 'test_*directory.py' -v
  wordpress:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      RUN_MODE: ${{ inputs.mode || 'check' }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/build-product-directory.py --mode "$RUN_MODE"
      - if: env.RUN_MODE == 'apply'
        run: python3 scripts/build-character-product-pages.py
      - run: python3 scripts/update-character-navigation.py --mode "$RUN_MODE"
