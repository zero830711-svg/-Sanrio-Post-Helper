name: Finalize Halloween article 7358
on:
  push:
    branches: [main]
    paths: ['blog/editorial/halloween-final-7358.json']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/finalize-halloween-7358.py
