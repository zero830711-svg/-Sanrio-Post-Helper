name: Refresh unseen catalog products
on:
  push:
    branches: [main]
    paths:
      - scripts/catalog-display-title.py
      - scripts/refresh-catalog-display-titles.py
      - scripts/fetch-lovely-backfill.php
      - .github/workflows/catalog-new-products.yml
  workflow_dispatch:
    inputs:
      refresh_titles:
        description: Refresh existing product display names as well
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sanrio-other-character-rakuten-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify readable titles and preserved source dates
        run: |
          python3 -m pip install --quiet Pillow
          php -l scripts/fetch-lovely-backfill.php
          php tests/lovely-backfill.php
          node --check scripts/unified-product-search.js
          python3 -m unittest discover -s tests -p test_catalog_display_titles.py -v
          python3 -m unittest discover -s tests -p test_unified_product_search.py -v
          sudo apt-get update -qq
          sudo apt-get install --yes lftp
      - name: Check latest pages for unseen products only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          refresh_tmp=$(mktemp -d)
          trap 'rm -rf "$refresh_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get .rakuten-settings.php -o "$refresh_tmp/settings.php"
          bye
          LFTP
          python3 -u scripts/lovely-backfill-state.py prepare "$refresh_tmp/before.json"
          php scripts/fetch-lovely-backfill.php "$refresh_tmp/settings.php" "$refresh_tmp/before.json" "$refresh_tmp/candidates.json" "$refresh_tmp/next.json" --latest-only
          python3 - "$refresh_tmp/before.json" "$refresh_tmp/next.json" <<'PY'
          import json,sys
          before,after=[json.load(open(path)) for path in sys.argv[1:]]
          for key in ["cursor","pending","finished"]:
            assert before[key]==after[key], "Historical checkpoint changed: "+key
          assert set(before["known"]).issubset(after["known"])
          assert after["lastBatch"]["mode"]=="latest-unseen"
          print("LATEST CHECKPOINT VERIFIED",json.dumps(after["lastBatch"],ensure_ascii=False))
          PY
          cp "$refresh_tmp/candidates.json" latest-unseen-candidates.json
          if python3 -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1])) else 1)' "$refresh_tmp/candidates.json"; then
            python3 -u scripts/import-discovered-products.py --candidates "$refresh_tmp/candidates.json" --limit 10000
          else
            python3 -c 'import json;json.dump({"newUniqueOffers":0,"newCharacterPlacements":0,"updatedPages":0},open("lovely-import-report.json","w"))'
            echo "LATEST: no unregistered verified products; existing catalogs retained"
          fi
          python3 -u scripts/lovely-backfill-state.py commit "$refresh_tmp/next.json"
          python3 -c 'import json,sys;json.dump(json.load(open(sys.argv[1]))["lastBatch"],open("latest-products-report.json","w"),ensure_ascii=False,indent=2)' "$refresh_tmp/next.json"
      - name: Refresh visible titles without changing products, URLs or dates
        if: github.event_name == 'push' || inputs.refresh_titles
        run: python3 -u scripts/refresh-catalog-display-titles.py
      - name: Preserve product positions and refresh use-case features
        run: python3 -u scripts/catalog-experiences.py
      - name: Build and update the existing image sitemap
        run: |
          python3 -u scripts/catalog-image-seo.py
          python3 -u scripts/deploy-catalog-image-sitemap.py
      - name: Verify all 36 public character pages and product anchors
        run: python3 -u scripts/repair-blank-character-pages.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: catalog-new-products-report
          path: |
            catalog-title-report.json
            latest-products-report.json
            latest-unseen-candidates.json
            lovely-import-report.json
            catalog-image-report.json
