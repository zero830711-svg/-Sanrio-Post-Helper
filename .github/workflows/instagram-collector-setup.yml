name: Deploy and verify Instagram collector setup
on:
  push:
    branches: [main]
    paths:
      - server/lolipop/instagram-worker.py
      - server/lolipop/instagram-mobile-worker.py
      - tests/test_instagram_mobile.py
      - server/lolipop/instagram-setup.php
      - .github/workflows/instagram-collector-setup.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-collector-setup
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build read-only collector dependencies
        run: |
          python -m pip install --target build/ig-mobile --no-compile --no-binary charset-normalizer instagrapi==3.0.21
          PYTHONPATH=build/ig-mobile python -c 'from instagrapi import Client; import importlib.metadata; assert importlib.metadata.version("instagrapi") == "3.0.21"; c=Client(); assert "password" not in c.get_settings(); assert hasattr(c,"user_medias_v1")'
          python - <<'PYTHON'
          import pathlib, zipfile
          root=pathlib.Path('build/ig-mobile')
          with zipfile.ZipFile('build/instagram-mobile-lib.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PYTHON
          python -m py_compile server/lolipop/instagram-worker.py server/lolipop/instagram-mobile-worker.py
          PYTHONPATH=build/ig-mobile python -m unittest discover -s tests -p test_instagram_mobile.py
          php -l server/lolipop/instagram-setup.php
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes lftp
      - name: Deploy setup and verify server import
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ig_tmp=$(mktemp -d)
          trap 'rm -rf "$ig_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          put build/instagram-mobile-lib.zip
          put server/lolipop/instagram-mobile-worker.py
          put server/lolipop/instagram-worker.py
          put server/lolipop/instagram-setup.php
          put server/lolipop/news-instagram.php
          put server/lolipop/news.php
          get config.php -o "$ig_tmp/config.php"
          bye
          LFTP
          php -r '
          $config=require $argv[1];
          $c=curl_init("https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/instagram-setup.php");
          curl_setopt_array($c,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>80,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_HTTPHEADER=>["Authorization: Bearer ".$config["sync_key"]]]);
          $body=curl_exec($c);$status=curl_getinfo($c,CURLINFO_HTTP_CODE);curl_close($c);$d=json_decode((string)$body,true);
          if($status!==200||empty($d["ok"])||($d["version"]??"")!=="3.0.21"||($d["engine"]??"")!=="instagrapi"){fwrite(STDERR,"Collector runtime import failed; private details withheld.\n");echo "HTTP status: ".$status."; process exit: ".($d["processExit"]??"unknown")."\n";echo "Runtime diagnosis: ".($d["errorType"]??"unknown")." ".($d["runtimeDiagnostic"]??"")."\n";exit(1);}
          echo "Lolipop collector import verified: instagrapi ".$d["version"]."; authenticated session ".(!empty($d["configured"])?"present":"not yet configured").".\n";
          ' "$ig_tmp/config.php"

          php -r '
          $config=require $argv[1];$c=curl_init("https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/instagram-setup.php?action=refresh");
          curl_setopt_array($c,[CURLOPT_POST=>true,CURLOPT_POSTFIELDS=>"",CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>80,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_HTTPHEADER=>["Authorization: Bearer ".$config["sync_key"]]]);
          $body=curl_exec($c);curl_close($c);$d=json_decode((string)$body,true);
          $accounts=array_column($d["accounts"]??[],"account");
          foreach(["friendcharacters","sanrio_kr","sanriogiftgatehk"] as $account){if(!in_array($account,$accounts,true)){fwrite(STDERR,"Instagram account not collected: ".$account."; no retry.\\n");exit(1);}}
          foreach($d["accounts"] as $row)echo "Collected ".$row["account"].": ".(int)$row["photoCount"]." photos; ".(int)$row["captionLength"]." caption characters.\\n";
          ' "$ig_tmp/config.php"

          php -r '
          $config=require $argv[1];$base="https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/news.php";
          $c=curl_init($base."?action=list");curl_setopt_array($c,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>35,CURLOPT_HTTPHEADER=>["Authorization: Bearer ".$config["sync_key"]]]);$list=json_decode((string)curl_exec($c),true);curl_close($c);
          foreach(["sanrio_kr","sanriogiftgatehk"] as $account){
          $row=null;foreach($list["items"]??[] as $item)if(($item["instagramAccount"]??"")===$account){$row=$item;break;}
          if(!$row)throw new RuntimeException("Saved overseas post unavailable");
          $c=curl_init($base."?action=ai-draft");curl_setopt_array($c,[CURLOPT_POST=>true,CURLOPT_POSTFIELDS=>json_encode(["url"=>$row["url"]]),CURLOPT_RETURNTRANSFER=>true,CURLOPT_TIMEOUT=>75,CURLOPT_HTTPHEADER=>["Authorization: Bearer ".$config["sync_key"],"Content-Type: application/json","Origin: https://zero830711-svg.github.io"]]);$d=json_decode((string)curl_exec($c),true);curl_close($c);
          $text=$d["text"]??"";if(empty($d["ok"])||!$text||!preg_match("/[ぁ-ゖァ-ヺ]/u",$text)||preg_match("/[\\x{AC00}-\\x{D7AF}]|優惠|購物|會員/u",$text)){fwrite(STDERR,"Japanese generation check failed: ".$account."; ".($d["error"]??"language check")."\\n");exit(1);}
          echo "Japanese generation verified: ".$account."; ".mb_strlen($text)." characters.\\n";
          }
          ' "$ig_tmp/config.php"
