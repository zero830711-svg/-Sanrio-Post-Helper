name: Inspect hosting root paths
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-host-root-20261030.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
    steps:
      - run: |
          python3 - <<'PY'
          import ftplib,os,ssl,json
          from urllib import parse
          u=parse.urlsplit(os.environ['LOLIPOP_FTP_HOST'] if '://' in os.environ['LOLIPOP_FTP_HOST'] else 'ftp://'+os.environ['LOLIPOP_FTP_HOST'])
          with ftplib.FTP_TLS(timeout=20,context=ssl.create_default_context()) as f:
              f.connect(u.hostname,u.port or 21);f.login(os.environ['LOLIPOP_FTP_USER'],os.environ['LOLIPOP_FTP_PASSWORD']);f.prot_p()
              f.cwd('sanrio-fan'); print('SITE_DIR',f.pwd())
              entries=list(f.mlsd()); print('DIRS',json.dumps([n for n,x in entries if x.get('type')=='dir']))
              print('FILES',json.dumps([n for n,x in entries if x.get('type')=='file' and n in ('robots.txt','ads.txt','wp-config.php','.htaccess')]))
          PY
