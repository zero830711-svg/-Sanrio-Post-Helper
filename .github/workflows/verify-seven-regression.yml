name: Verify existing news sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-seven-regression.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify existing Gashapon and manufacturers
        run: |
          python3 - <<'PY'
          import ftplib, os, ssl, subprocess, tempfile
          from urllib.parse import urlsplit
          host=os.environ['LOLIPOP_FTP_HOST']
          address=urlsplit(host if '://' in host else 'ftp://'+host)
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=35)
          path=None
          try:
              ftp.connect(address.hostname,address.port or 21)
              ftp.login(os.environ['LOLIPOP_FTP_USER'],os.environ['LOLIPOP_FTP_PASSWORD'])
              ftp.prot_p()
              ftp.cwd(os.environ['LOLIPOP_TREND_DIR'])
              fd,path=tempfile.mkstemp(prefix='sph-config-',suffix='.php')
              with os.fdopen(fd,'wb') as target:
                  ftp.retrbinary('RETR config.php',target.write)
              ftp.quit()
              ftp=None
              subprocess.run(['php','scripts/verify-gashapon-news.php',path],check=True)
              subprocess.run(['php','scripts/verify-deployed-news-extra.php',path],check=True)
          finally:
              if ftp is not None:
                  try: ftp.close()
                  except Exception: pass
              if path:
                  try: os.unlink(path)
                  except FileNotFoundError: pass
          PY
