name: Clarify Usahana popup dates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clarify-usahana-visit-20261030.yml']
permissions:
  contents: read
concurrency:
  group: sanrio-wordpress-rest
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Backup
        run: |
          cat > /tmp/usahana.py <<'PY'
          import importlib.util,json,pathlib,sys,re
          spec=importlib.util.spec_from_file_location('ed','scripts/publish-editorial-article.py');mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);wp=mod.WordPress()
          path='/wp/v2/posts/512'; d=pathlib.Path('usahana-backup');d.mkdir(exist_ok=True);f=d/'before.json'
          if sys.argv[1]=='prepare':
              p=wp.call(path+'?context=edit')
              assert p['id']==512 and p['status']=='publish' and p['link']=='https://sanrio-fan.site/usahana-popup-yongsan-visit/'
              f.write_text(json.dumps(p,ensure_ascii=False),encoding='utf-8')
              print('BACKUP',p['link'])
          else:
              b=json.loads(f.read_text(encoding='utf-8'));p=wp.call(path+'?context=edit')
              assert b['modified_gmt']==p['modified_gmt'] and b['content']['raw']==p['content']['raw']
              doc=p['content']['raw']
              changes=[
               ('会期は2026年10月1日〜27日と案内されています。','訪問時に確認した案内では会期は2026年10月1日〜27日でした。案内された期間は過ぎていますが、延長や再開催の有無は確認できていません。'),
               ('直前の変更は','現在の開催状況は'),
               ('営業時間・入店方法：訪問日のSanrio Q公式Instagramと店頭案内で確認','当時の営業時間・入店方法：訪問時のSanrio Q公式Instagramと店頭案内を参照')]
              for old,new in changes:
                  assert doc.count(old)==1,old
                  doc=doc.replace(old,new,1)
              assert re.findall(r'href=["\x27]([^"\x27]+)',doc)==re.findall(r'href=["\x27]([^"\x27]+)',p['content']['raw'])
              assert re.findall(r'<img\b[^>]*>',doc)==re.findall(r'<img\b[^>]*>',p['content']['raw'])
              wp.call(path,data={'content':doc});a=wp.call(path+'?context=edit')
              assert a['content']['raw']==doc
              for k in ('title','excerpt','slug','link','status','featured_media','date','categories','tags','author'): assert a[k]==b[k],k
              print('UPDATED',a['link'])
          PY
          python3 /tmp/usahana.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: usahana-before-${{ github.run_id }}
          path: usahana-backup/
          retention-days: 90
      - name: Apply and verify
        run: python3 /tmp/usahana.py apply
