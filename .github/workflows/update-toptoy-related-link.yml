name: Update TOPTOY related article link
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-toptoy-related-link.py'
      - '.github/workflows/update-toptoy-related-link.yml'
permissions:
  contents: read
concurrency:
  group: sanrio-toptoy-related-link
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m py_compile scripts/update-toptoy-related-link.py
      - run: python3 scripts/update-toptoy-related-link.py
