name: Import other character Rakuten photo catalogs
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch-rakuten-character-catalog.php
      - scripts/repair-character-catalogs.py
      - scripts/build-product-directory.py
      - scripts/update-character-navigation.py
      - tests/test_character_catalog_quality.py
      - .github/workflows/other-character-rakuten-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-other-character-rakuten-catalog
  cancel-in-progress: true
jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-format-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate importer and fetcher syntax
        run: |
          python3 -m pip install --quiet Pillow
          python3 -m py_compile scripts/import-rakuten-character-catalog.py
          php -l scripts/fetch-rakuten-character-catalog.php
          php -l server/lolipop/product-flow.php
          php tests/product-flow.php
      - name: Test catalog selection and UI generation
        run: python3 -m unittest discover -s tests -p test_character_catalog_quality.py -v
      - name: Repair existing catalogs and character navigation through REST
        if: github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[refresh-catalogs]')
        run: python3 scripts/repair-character-catalogs.py
      - name: Install FTPS client
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-catalogs]')
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes lftp
      - name: Import each character catalog through WordPress REST
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-catalogs]')
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          catalog_tmp=$(mktemp -d)
          trap 'rm -rf "$catalog_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get config.php -o "$catalog_tmp/config.php"
          bye
          LFTP
          character_order=$(python3 - <<'PYORDER'
          import importlib.util
          spec=importlib.util.spec_from_file_location('catalog','scripts/import-rakuten-character-catalog.py')
          c=importlib.util.module_from_spec(spec);spec.loader.exec_module(c)
          ids=','.join(str(v[0]) for v in c.CHARACTERS.values())
          pages=c.WordPress().call('/wp/v2/pages?context=edit&per_page=100&include='+ids+'&_fields=id,content')
          counts={p['id']:len(c.extract_existing_cards(p['content']['raw'])) for p in pages}
          print(' '.join(sorted((key for key in c.CHARACTERS if counts.get(c.CHARACTERS[key][0],0)<c.MAX_CARDS),key=lambda key:counts.get(c.CHARACTERS[key][0],0))))
          PYORDER
          )
          failures=0
          for character in $character_order; do
            if ! php scripts/fetch-rakuten-character-catalog.php "$catalog_tmp/config.php" "$character" "$catalog_tmp/$character.json"; then
              echo "Preserved $character because candidate fetch failed."
              failures=$((failures+1))
              continue
            fi
            set +e
            python3 scripts/import-rakuten-character-catalog.py --character "$character" --candidates "$catalog_tmp/$character.json"
            status=$?
            set -e
            if [[ "$status" -eq 2 ]]; then
              echo "Skipped $character because fewer than 12 verified photos were available."
            elif [[ "$status" -ne 0 ]]; then
              failures=$((failures+1))
            fi
          done
          python3 scripts/repair-character-catalogs.py
          if [[ "$failures" -gt 0 ]]; then
            echo "$failures character updates failed; their existing pages were preserved."
            exit 1
          fi
