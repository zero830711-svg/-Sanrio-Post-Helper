name: Inspect Sanrio homepage product cards
on:
  push:
    branches: [main]
    paths:
      - scripts/inspect-home-product-cards.py
      - .github/workflows/inspect-home-product-cards.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Inspect the homepage over WordPress REST
        run: python3 scripts/inspect-home-product-cards.py
