name: Update character gacha navigation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-character-gacha-guides.py'
      - '.github/workflows/character-gacha-guides.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-character-gacha-guides
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/update-character-gacha-guides.py --self-test
      - run: python3 scripts/update-character-gacha-guides.py
