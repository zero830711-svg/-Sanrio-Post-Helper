name: Deploy seven news sources safely
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-seven-news.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Check source parsers
        run: |
          php -l server/lolipop/news.php
          php -l server/lolipop/news-seven.php
          php -l server/lolipop/news-gashapon.php
          php tests/news-seven.php
          php tests/news-parser.php
      - name: Upload changed files and verify live API
        run: |
          python3 - <<'PY'
          import ftplib, hashlib, os, pathlib, ssl, subprocess, tempfile
          from urllib.parse import urlsplit
          host = os.environ['LOLIPOP_FTP_HOST']
          username = os.environ['LOLIPOP_FTP_USER']
          password = os.environ['LOLIPOP_FTP_PASSWORD']
          directory = os.environ['LOLIPOP_TREND_DIR']
          if not all([host, username, password, directory]):
              raise RuntimeError('FTP configuration is missing')
          address = urlsplit(host if '://' in host else 'ftp://' + host)
          if address.scheme not in ('ftp', 'ftps') or not address.hostname:
              raise RuntimeError('FTP host format is not supported')
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=35)
          config_path = None
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          try:
              ftp.connect(address.hostname, address.port or 21)
              ftp.login(username, password)
              ftp.prot_p()
              ftp.cwd(directory)
              expected = {
                  'news.php': {'c310199630995a69a97e6509a91b2a941daa0cf1', '771460ba95e8d6be119feab1a1622bd782856862'},
                  'news-gashapon.php': {'8c2b2312547eb40fcdc4cd1812e681f4dd15c41e', 'dde6097c9d03493c7a1181ac114a5ce919b053af'},
              }
              for name, approved in expected.items():
                  chunks = []
                  ftp.retrbinary('RETR ' + name, chunks.append)
                  if blob_hash(b''.join(chunks)) not in approved:
                      raise RuntimeError(name + ' differs from the reviewed server version; deployment stopped')
              for name in ('news-seven.php', 'news-gashapon.php', 'news.php'):
                  temporary = '.' + name + '.sph-deploy-tmp'
                  with open(pathlib.Path('server/lolipop') / name, 'rb') as source:
                      ftp.storbinary('STOR ' + temporary, source)
                  ftp.rename(temporary, name)
                  print(name + ' uploaded')
              fd, config_path = tempfile.mkstemp(prefix='sph-config-', suffix='.php')
              with os.fdopen(fd, 'wb') as target:
                  ftp.retrbinary('RETR config.php', target.write)
              ftp.quit()
              ftp = None
              subprocess.run(['php', 'scripts/verify-seven-news.php', config_path], check=True)
          finally:
              if ftp is not None:
                  try: ftp.close()
                  except Exception: pass
              if config_path:
                  try: os.unlink(config_path)
                  except FileNotFoundError: pass
          PY
