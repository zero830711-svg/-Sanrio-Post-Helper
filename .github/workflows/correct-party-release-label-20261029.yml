name: Correct release label 20261029
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-party-release-label-20261029.yml']
permissions:
  contents: read
concurrency:
  group: sanrio-wordpress-rest
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Correct label and verify
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('ed','scripts/publish-editorial-article.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);wp=mod.WordPress()
          path='/wp/v2/posts/332'
          p=wp.call(path+'?context=edit')
          old='<th>発売予定日</th>'
          assert p['content']['raw'].count(old)==1 and 'に発売されたNintendo' in p['content']['raw']
          doc=p['content']['raw'].replace(old,'<th>発売日</th>',1)
          wp.call(path,data={'content':doc})
          after=wp.call(path+'?context=edit')
          assert after['content']['raw']==doc and after['link']==p['link'] and after['featured_media']==p['featured_media']
          print('UPDATED',after['link'])
          PY
