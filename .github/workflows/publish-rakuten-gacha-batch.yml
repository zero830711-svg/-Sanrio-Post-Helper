name: Publish Rakuten Sanrio gacha articles
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "公開前に候補一覧を確認し、公開する時だけ有効にする"
        required: true
        default: false
        type: boolean
      product_name:
        description: "公開対象の商品名。公開時は完全一致で指定する"
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: sanrio-rakuten-gacha-batch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate publisher and install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes lftp php-cli php-curl
          python3 -m pip install --quiet Pillow
          php -l scripts/fetch-rakuten-gacha-candidates.php
          python3 -m py_compile scripts/publish-rakuten-gacha-batch.py scripts/publish-editorial-article.py scripts/update-home-gacha-shelf.py
          python3 scripts/publish-rakuten-gacha-batch.py --self-test
          python3 -m json.tool blog/gacha-rakuten-batch.json >/dev/null
      - name: Download private Rakuten configuration
        run: |
          set -euo pipefail
          umask 077
          gacha_tmp=$(mktemp -d "$RUNNER_TEMP/sanrio-rakuten-gacha.XXXXXX")
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get config.php -o "$gacha_tmp/config.php"
          bye
          LFTP
          echo "RAKUTEN_GACHA_TMP=$gacha_tmp" >> "$GITHUB_ENV"
      - name: Fetch Sanrio capsule-toy products from the Rakuten API
        run: php scripts/fetch-rakuten-gacha-candidates.php "$RAKUTEN_GACHA_TMP/config.php" blog/gacha-rakuten-batch.json "$RAKUTEN_GACHA_TMP/candidates.json"
      - name: Preview matched products without publishing
        if: ${{ !inputs.publish }}
        env:
          PUBLISH_PRODUCT_NAME: ${{ inputs.product_name }}
        run: python3 scripts/publish-rakuten-gacha-batch.py --candidates "$RAKUTEN_GACHA_TMP/candidates.json" --limit 50 --dry-run --product-name "$PUBLISH_PRODUCT_NAME"
      - name: Publish one WordPress article per verified product
        if: ${{ inputs.publish }}
        env:
          PUBLISH_PRODUCT_NAME: ${{ inputs.product_name }}
        run: python3 scripts/publish-rakuten-gacha-batch.py --candidates "$RAKUTEN_GACHA_TMP/candidates.json" --limit 1 --product-name "$PUBLISH_PRODUCT_NAME"
      - name: Refresh the 3-column homepage gacha shelf through WordPress REST API
        if: ${{ inputs.publish }}
        run: python3 scripts/update-home-gacha-shelf.py
      - name: Remove private temporary files
        if: always()
        run: |
          if [[ -n "${RAKUTEN_GACHA_TMP:-}" && -d "${RAKUTEN_GACHA_TMP:-}" ]]; then
            rm -rf -- "$RAKUTEN_GACHA_TMP"
          fi
