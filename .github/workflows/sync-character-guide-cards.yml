name: Sync Sanrio character guide cards
on:
  push:
    branches: [main]
    paths:
      - scripts/sync-character-guide-cards.py
      - .github/workflows/sync-character-guide-cards.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=配置確認 / apply=反映 / audit=全ページと記事タグ棚卸し'
        required: true
        default: check
        type: choice
        options: [check, apply, audit]
permissions:
  contents: read
concurrency:
  group: sanrio-wordpress-rest
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      RUN_MODE: ${{ contains(github.event.head_commit.message, '[audit-character-pages]') && 'audit' || contains(github.event.head_commit.message, '[apply-character-guide-cards]') && 'apply' || inputs.mode || 'check' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate script
        run: python3 -m py_compile scripts/sync-character-guide-cards.py
      - name: Check or update character pages through standard REST API
        run: python3 scripts/sync-character-guide-cards.py --mode "$RUN_MODE"
