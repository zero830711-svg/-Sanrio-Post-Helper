name: Patch ChatGPT direct share URL

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-direct-share-url.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Patch share URL and cache version
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const shareUrl=new URL("./share.html",location.href);' app.js
          sed -i 's#const shareUrl=new URL("./share.html",location.href);#const shareUrl=new URL("https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/share.php");#' app.js
          sed -i '/shareUrl.searchParams.set("v","private");/d' app.js
          sed -i 's#shareUrl.hash="token="+encodeURIComponent(result.token);#shareUrl.searchParams.set("token",result.token);#' app.js
          sed -i 's/2026\.10\.04-3436/2026.10.04-3437/g' app.js index.html
          sed -i 's/20261004-3436/20261004-3437/g' index.html
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use direct Lolipop URL for ChatGPT share links'
          git push
