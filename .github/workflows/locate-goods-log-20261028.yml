name: Locate server error logs
on:
  push:
    paths: ['.github/workflows/locate-goods-log-20261028.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      USER: ${{ secrets.LOLIPOP_FTP_USER }}
      PASS: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$USER","$PASS" "$HOST" <<'EOF'
          set net:timeout 15
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          cls -1
          bye
          EOF
