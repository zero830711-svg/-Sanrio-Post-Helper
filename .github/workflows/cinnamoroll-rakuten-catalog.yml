name: Import Cinnamoroll Rakuten photo catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-cinnamoroll-rakuten.php
      - scripts/import-cinnamoroll-rakuten-catalog.py
      - .github/workflows/cinnamoroll-rakuten-catalog.yml
permissions:
  contents: read
concurrency:
  group: sanrio-cinnamoroll-rakuten-catalog
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate importer and fetcher syntax
        run: |
          python3 -m pip install --quiet Pillow
          python3 -m py_compile scripts/import-cinnamoroll-rakuten-catalog.py
          php -l scripts/fetch-cinnamoroll-rakuten.php
      - name: Install FTPS client
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-catalogs]')
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes lftp
      - name: Fetch private Rakuten candidates and update only Cinnamoroll
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-catalogs]')
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          catalog_tmp=$(mktemp -d)
          trap 'rm -rf "$catalog_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get config.php -o "$catalog_tmp/config.php"
          bye
          LFTP
          php scripts/fetch-cinnamoroll-rakuten.php "$catalog_tmp/config.php" "$catalog_tmp/candidates.json"
          python3 scripts/import-cinnamoroll-rakuten-catalog.py --candidates "$catalog_tmp/candidates.json"
