name: Publish one Sanrio roomwear guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-sanrio-roomwear-guide-20261030.yml']
permissions:
  contents: read
concurrency:
  group: sanrio-editorial-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Check distinct published article and publish one
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          for term in ['ジェラートピケ','gelato pique']:
              u='https://sanrio-fan.site/wp-json/wp/v2/posts?per_page=100&search='+urllib.parse.quote(term)
              posts=json.load(urllib.request.urlopen(u,timeout=40))
              matches=[x for x in posts if ('ジェラート' in x['title']['rendered'] or 'gelato' in x['title']['rendered'].lower()) and ('サンリオ' in x['title']['rendered'] or 'sanrio' in x['title']['rendered'].lower())]
              if matches: raise RuntimeError('Existing related article requires review: '+str([x['id'] for x in matches]))
          print('No matching published collaboration article')
          PY
          python3 scripts/publish-editorial-article.py blog/editorial/gelato-2026-buying-guide.json
