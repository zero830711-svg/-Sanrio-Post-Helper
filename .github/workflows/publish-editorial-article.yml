name: Publish WordPress editorial article
on:
  push:
    branches: [main]
    paths:
      - 'blog/editorial/publish-*.json'
permissions:
  contents: read
concurrency:
  group: sanrio-editorial-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish queued editorial articles through WordPress REST API
        run: |
          set -euo pipefail
          for article in blog/editorial/publish-*.json; do
            python3 scripts/publish-editorial-article.py "$article"
          done
