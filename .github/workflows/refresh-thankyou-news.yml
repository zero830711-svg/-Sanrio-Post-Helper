name: Refresh official Thankyou news
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thankyou-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare verified official feed
        run: php scripts/build-thankyou-feed.php
      - name: Upload public feed over FTPS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lftp
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          put server/lolipop/.thankyou-news-feed.xml -o .thankyou-news-feed.xml.tmp
          mv .thankyou-news-feed.xml.tmp .thankyou-news-feed.xml
          bye
          LFTP
