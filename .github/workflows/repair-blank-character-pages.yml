name: Repair blank character pages
on:
  push:
    branches: [main]
    paths:
      - scripts/repair-blank-character-pages.py
      - .github/workflows/repair-blank-character-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-other-character-rakuten-catalog
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check formatter syntax
        run: python3 -m py_compile scripts/import-rakuten-character-catalog.py scripts/repair-blank-character-pages.py
      - name: Repair line boundaries and verify all 36 public pages
        run: python3 -u scripts/repair-blank-character-pages.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: character-render-backups
          path: character-render-backups/
          retention-days: 30
