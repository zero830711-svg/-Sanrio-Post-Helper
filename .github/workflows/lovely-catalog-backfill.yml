name: Import verified Lovely Fancy discovery backlog
on:
  push:
    branches: [main]
    paths:
      - scripts/fetch-lovely-backfill.php
      - scripts/lovely-backfill-state.py
      - scripts/import-discovered-products.py
      - .github/workflows/lovely-catalog-backfill.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-other-character-rakuten-catalog
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Check exact product matching and append preservation
        run: |
          python3 -m pip install --quiet Pillow
          php -l scripts/fetch-lovely-backfill.php
          python3 -m unittest discover -s tests -p test_discovery_import.py -v
          sudo apt-get update -qq
          sudo apt-get install --yes lftp
      - name: Discover historical candidates and import verified new photos via REST
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          discovery_tmp=$(mktemp -d)
          trap 'rm -rf "$discovery_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get .rakuten-settings.php -o "$discovery_tmp/settings.php"
          bye
          LFTP
          python3 -u scripts/lovely-backfill-state.py prepare "$discovery_tmp/state.json"
          php scripts/fetch-lovely-backfill.php "$discovery_tmp/settings.php" "$discovery_tmp/state.json" "$discovery_tmp/candidates.json" "$discovery_tmp/next.json"
          cp "$discovery_tmp/candidates.json" lovely-verified-candidates.json
          python3 -u scripts/import-discovered-products.py --candidates "$discovery_tmp/candidates.json" --limit 10000
          python3 -u scripts/lovely-backfill-state.py commit "$discovery_tmp/next.json"
          python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["lastBatch"],ensure_ascii=False,indent=2))' "$discovery_tmp/next.json" > lovely-backfill-report.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lovely-catalog-import-report
          path: |
            lovely-import-report.json
            lovely-backfill-report.json
            lovely-verified-candidates.json
