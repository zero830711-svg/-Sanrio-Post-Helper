name: Add verified plush shop dimensions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-chimapote-size-20261027.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/fix-chimapote-size-20261027.py
