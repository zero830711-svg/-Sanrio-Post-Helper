name: Publish standalone unknown Sanrio goods guide
on:
  push:
    branches: [main]
    paths:
      - 'blog/sanrio-unknown-goods-guide.html'
      - 'scripts/publish-unknown-goods-guide.py'
      - '.github/workflows/unknown-goods-guide.yml'
permissions:
  contents: read
concurrency:
  group: sanrio-unknown-goods-guide
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/publish-unknown-goods-guide.py
