name: Deploy Sanrio PHP APIs to Lolipop

on:
  push:
    branches: [main]
    paths:
      - "server/lolipop/overseas.php"
      - "server/lolipop/news.php"
      - "server/lolipop/news-extra.php"
      - "tests/news-parser.php"
      - "server/lolipop/trend.php"
      - "server/lolipop/archive-media-batch.php"
      - "server/lolipop/share.php"
      - "server/lolipop/lovely-watch.php"
      - "tests/lovely-parser.php"
      - "tests/hatakeyama-*"
      - "tests/gourmandise-*"
      - "tests/skater-*"
      - ".github/workflows/deploy-lolipop-trend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lolipop-trend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check PHP syntax
        run: |
          php -l server/lolipop/news.php
          php -l server/lolipop/news-extra.php
          php tests/news-parser.php
          php -l server/lolipop/trend.php
          php -l server/lolipop/archive-media-batch.php
          php -l server/lolipop/share.php
          php -l server/lolipop/lovely-watch.php
          php tests/lovely-parser.php
          php tests/hatakeyama-parser.php
          php tests/gourmandise-parser.php
          php tests/skater-parser.php
          php -l server/lolipop/overseas.php

      - name: Deploy PHP endpoints over FTPS
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LOLIPOP_FTP_HOST" || -z "$LOLIPOP_FTP_USER" || -z "$LOLIPOP_FTP_PASSWORD" || -z "$LOLIPOP_TREND_DIR" ]]; then
            echo "::notice::Lolipop deployment skipped. Add LOLIPOP_FTP_HOST, LOLIPOP_FTP_USER, LOLIPOP_FTP_PASSWORD, and LOLIPOP_TREND_DIR under Settings > Secrets and variables > Actions."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install --yes lftp
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          put server/lolipop/news.php
          put server/lolipop/news-extra.php
          put server/lolipop/trend.php
          put server/lolipop/archive-media-batch.php
          put server/lolipop/share.php
          put server/lolipop/lovely-watch.php
          put server/lolipop/overseas.php
          bye
          LFTP

      - name: Verify retired overseas endpoint
        run: |
          python3 - <<'PYVERIFY'
          import json, urllib.request, urllib.error
          try:
              urllib.request.urlopen('https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/overseas.php', timeout=20)
              raise SystemExit('Overseas endpoint is still active')
          except urllib.error.HTTPError as error:
              data=json.loads(error.read())
              assert error.code == 410 and data.get('disabled') is True and data.get('items') == [] and data.get('apiVersion') == '3438'
              print('Overseas endpoint retired: HTTP 410; no candidates returned.')
          PYVERIFY

      - name: Verify live Skater JAN match and product photo
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          match_tmp=$(mktemp -d)
          trap 'rm -rf "$match_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get .rakuten-settings.php -o "$match_tmp/settings.php"
          get config.php -o "$match_tmp/config.php"
          bye
          LFTP
          php scripts/verify-skater-match.php "$match_tmp/settings.php" "$match_tmp/config.php"

      - name: Verify deployed FURYU news
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          furyu_tmp=$(mktemp -d)
          trap 'rm -rf "$furyu_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get config.php -o "$furyu_tmp/config.php"
          bye
          LFTP
          php scripts/verify-furyu-news.php "$furyu_tmp/config.php"
          php scripts/verify-news-extra.php "$furyu_tmp/config.php"
