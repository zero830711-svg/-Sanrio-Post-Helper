name: Publish multilingual Sanrio character guides
on:
  push:
    branches: [main]
    paths:
      - scripts/multilingual-character-guides.py
      - tests/test_multilingual_character_guides.py
      - .github/workflows/multilingual-character-guides.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-multilingual-character-guides
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check script syntax and behavior
        run: |
          python3 -m py_compile scripts/multilingual-character-guides.py scripts/product-detail-pilot.py scripts/product-detail-english.py
          python3 -m unittest discover -s tests -p test_multilingual_character_guides.py -v
      - name: Publish multilingual character pages through WordPress REST
        run: python3 -u scripts/multilingual-character-guides.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: multilingual-character-guides-report
          path: multilingual-character-guides-report.json
