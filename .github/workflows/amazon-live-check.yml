name: Check saved Amazon API connection
on:
  push:
    branches: [check-amazon-live-20261014]
    paths: [.github/workflows/amazon-live-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - name: Install existing FTPS client
        run: sudo apt-get update -qq && sudo apt-get install --yes lftp
      - name: Check saved connection once without deployment or credential changes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          am_tmp=$(mktemp -d)
          trap 'rm -rf "$am_tmp"' EXIT
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get config.php -o "$am_tmp/config.php"
          bye
          LFTP
          php -r '
          $config=require $argv[1];
          $endpoint="https://fan-info.zombie.jp/sanrio-fan/sanrio-sync/amazon-creators.php";
          $headers=["Authorization: Bearer ".$config["sync_key"],"Origin: https://zero830711-svg.github.io","Content-Type: application/json"];
          $request=static function(string $action,?array $payload=null)use($endpoint,$headers):array{
           $c=curl_init($endpoint."?action=".$action);
           curl_setopt_array($c,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_PROTOCOLS=>CURLPROTO_HTTPS,CURLOPT_TIMEOUT=>65,CURLOPT_HTTPHEADER=>$headers]);
           if($payload!==null)curl_setopt_array($c,[CURLOPT_POST=>true,CURLOPT_POSTFIELDS=>json_encode($payload)]);
           $body=curl_exec($c);$status=(int)curl_getinfo($c,CURLINFO_RESPONSE_CODE);curl_close($c);
           return [$status,json_decode((string)$body,true)];
          };
          [$status,$settings]=$request("settings");
          if($status!==200||empty($settings["ok"])){echo "Settings check failed; HTTP ".$status."\n";exit(1);}
          echo "Saved Amazon credentials configured: ".(!empty($settings["configured"])?"yes":"no")."; version: ".($settings["version"]??"unknown")."\n";
          if(empty($settings["configured"]))exit(1);
          [$status,$result]=$request("search",["keywords"=>"サンリオ"]);
          if($status!==200||empty($result["ok"])){
           $stage=in_array($result["stage"]??"",["authentication","product-search"],true)?$result["stage"]:"unknown";
           $upstream=is_int($result["upstreamStatus"]??null)?$result["upstreamStatus"]:0;
           echo "Amazon live check failed; endpoint HTTP ".$status."; stage: ".$stage."; Amazon HTTP ".$upstream."\n";
           exit(1);
          }
          echo "Amazon live search connected: ".(!empty($result["connected"])?"yes":"no")."; product count: ".count($result["items"]??[])."\n";
          foreach($result["items"]??[] as $item){echo "Product verified; Amazon URL: ".((parse_url($item["url"]??"",PHP_URL_HOST)==="www.amazon.co.jp")?"yes":"no")."; photo supplied: ".(!empty($item["image"])?"yes":"no")."\n";}
          ' "$am_tmp/config.php"
