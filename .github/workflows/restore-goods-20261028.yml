name: Restore product search
on:
  push:
    paths: ['.github/workflows/restore-goods-20261028.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_USER: ${{ secrets.SANRIO_WP_USER }}
      WP_PASS: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save playwright
      - name: Verify temporary page and restore search
        run: |
          cat > /tmp/restore-goods.py <<'PY'
          import requests,re,os,uuid,subprocess,json
          from requests.auth import HTTPBasicAuth
          s=requests.Session();s.auth=HTTPBasicAuth(os.environ['WP_USER'],os.environ['WP_PASS'])
          base='https://sanrio-fan.site';api=base+'/wp-json/wp/v2/pages'
          r=s.get(api+'/804',params={'context':'edit','_fields':'id,slug,content'},timeout=60);r.raise_for_status();page=r.json()
          if page['slug']!='goods':raise Exception('page mismatch')
          raw=page['content']['raw']
          old='payload=source.textContent;'
          new="payload=source.dataset.src ? await (await fetch(source.dataset.src)).text() : source.textContent;"
          if raw.count(old)!=1:raise Exception('script marker mismatch')
          url=base+'/wp-content/uploads/2026/10/sanrio-search-index-20261028.txt'
          pattern=r'(<script\b[^>]*id="sf-unified-search-data"[^>]*>)(.*?)(</script>)'
          def replace(m):return m.group(1)[:-1]+' data-src="'+url+'"></script>'
          updated,n=re.subn(pattern,replace,raw,flags=re.S)
          if n!=1:raise Exception('data marker mismatch')
          updated=updated.replace(old,new)
          marker=uuid.uuid4().hex;pid=None
          try:
              r=s.post(api,json={'status':'publish','slug':'temporary-render-test-'+marker,'title':'Temporary rendering test','content':'<meta name="robots" content="noindex,nofollow">'+updated},timeout=60)
              r.raise_for_status();obj=r.json();pid=obj['id']
              subprocess.run(['node','/tmp/check-goods.cjs',obj['link']],check=True,timeout=120)
          finally:
              if pid:
                  d=s.delete(api+'/'+str(pid),params={'force':'true'},timeout=45);d.raise_for_status();print('test page cleaned',flush=True)
          current=s.get(api+'/804',params={'context':'edit','_fields':'content'},timeout=60);current.raise_for_status()
          if current.json()['content']['raw']!=raw:raise Exception('Page changed; aborting')
          saved=s.post(api+'/804',json={'content':updated},timeout=90);saved.raise_for_status()
          if 'data-src="'+url+'"' not in saved.json()['content']['raw']:raise Exception('Save did not persist')
          subprocess.run(['node','/tmp/check-goods.cjs',base+'/goods/?v='+marker],check=True,timeout=120)
          print('Production search verified',flush=True)
          PY
          cat > /tmp/check-goods.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(process.argv[2],{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('.sf-directory-card',{timeout:60000});
            let initial=await page.locator('.sf-directory-card').count();
            let links=await page.locator('.sf-directory-card a').count();
            await page.locator('[data-sf-search]').fill('クロミ');
            await page.waitForTimeout(1000);
            let filtered=await page.locator('.sf-directory-card').count();
            let text=await page.locator('[data-sf-count]').innerText();
            console.log(JSON.stringify({status:response.status(),initial,links,filtered,count:text,errors}));
            if(response.status()!==200||initial<1||links<1||filtered<1||errors.length)throw Error('Search verification failed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 /tmp/restore-goods.py
