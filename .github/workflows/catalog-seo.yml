name: Improve catalog search entry pages
on:
  push:
    branches: [main]
    paths: [.github/workflows/catalog-seo.yml, scripts/catalog-seo.py, tests/test_catalog_seo.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-other-character-rakuten-catalog
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify descriptions, static products and existing character content
        run: |
          python3 -m unittest discover -s tests -p test_catalog_seo.py -v
          python3 -m unittest discover -s tests -p test_unified_product_search.py -v
      - name: Publish SEO entry pages and descriptions via standard REST
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[catalog-seo]')
        run: python3 -u scripts/catalog-seo.py
