name: Publish fixed product detail pilot
on:
  push:
    branches: [main]
    paths:
      - scripts/product-detail-pilot.py
      - scripts/product-detail-pilot.css
      - scripts/fetch-product-detail-pilot.php
      - scripts/verify-product-detail-pilot.py
      - .github/workflows/product-detail-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    if: ${{ !contains(github.event.head_commit.message, '[detail-to-500]') }}
    concurrency:
      group: sanrio-other-character-rakuten-catalog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANRIO_WP_USER: ${{ secrets.SANRIO_WP_USER }}
      SANRIO_WP_APP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify facts, stable URLs and existing product preservation
        run: |
          python3 -m pip install --quiet Pillow
          php -l scripts/fetch-product-detail-pilot.php
          python3 -m unittest discover -s tests -p test_product_detail_pilot.py -v
          sudo apt-get update -qq
          sudo apt-get install --yes lftp
      - name: Verify existing products with Rakuten and publish the fixed cohort
        if: ${{ !contains(github.event.head_commit.message, '[detail-to-500]') }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          detail_tmp=$(mktemp -d)
          trap 'rm -rf "$detail_tmp"' EXIT
          if [ "$DETAIL_TO_100" = true ]; then
            python3 -u scripts/product-detail-pilot.py --prepare100 "$detail_tmp/candidates.json"
          else
            if python3 -u scripts/product-detail-pilot.py --maintain; then
              exit 0
            else
              detail_status=$?
              if [ "$detail_status" != 3 ]; then exit "$detail_status"; fi
            fi
            if python3 -u scripts/product-detail-pilot.py --cached "$detail_tmp/verified.json"; then
              python3 -u scripts/product-detail-pilot.py --publish "$detail_tmp/verified.json"
              exit 0
            fi
            python3 -u scripts/product-detail-pilot.py --prepare "$detail_tmp/candidates.json"
          fi
          lftp -u "$LOLIPOP_FTP_USER","$LOLIPOP_FTP_PASSWORD" "$LOLIPOP_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 1
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$LOLIPOP_TREND_DIR"
          get .rakuten-settings.php -o "$detail_tmp/settings.php"
          bye
          LFTP
          php scripts/fetch-product-detail-pilot.php "$detail_tmp/settings.php" "$detail_tmp/candidates.json" "$detail_tmp/verified.json"
          if [ "$DETAIL_TO_100" = true ]; then
            python3 -u scripts/product-detail-pilot.py --expand100 "$detail_tmp/verified.json"
          else
            python3 -u scripts/product-detail-pilot.py --publish "$detail_tmp/verified.json"
          fi
        env:
          DETAIL_TO_100: ${{ contains(github.event.head_commit.message, '[detail-to-100]') }}
      - name: Verify public indexability and sitemap discovery
        if: ${{ !contains(github.event.head_commit.message, '[detail-to-500]') }}
        run: python3 -u scripts/verify-product-detail-pilot.py
      - name: Include detail photos in the existing image sitemap
        if: ${{ !contains(github.event.head_commit.message, '[detail-to-500]') }}
        run: |
          python3 -u scripts/catalog-image-seo.py
          python3 -u scripts/deploy-catalog-image-sitemap.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: product-detail-pilot-report
          path: |
            product-detail-maintenance-report.json
            product-detail-selection.json
            product-detail-pilot-report.json
            product-detail-discovery-report.json
            catalog-image-report.json

