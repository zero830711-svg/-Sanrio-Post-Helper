name: Collect overseas Sanrio candidates
on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanrio-overseas-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOLIPOP_FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
      LOLIPOP_FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
      LOLIPOP_FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
      LOLIPOP_TREND_DIR: ${{ secrets.LOLIPOP_TREND_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp
      - name: Refresh authenticated overseas snapshot
        run: bash scripts/collect-overseas.sh
