name: Playwright mobile smoke tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "amazon-scout.html"
      - "local-ai-test.html"
      - "local-ai-test.js"
      - "local-ai-worker.js"
      - "app.js"
      - "news.js"
      - "amazon-reports.js"
      - "revenue-insights.js"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "tests/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "amazon-scout.html"
      - "local-ai-test.html"
      - "local-ai-test.js"
      - "local-ai-worker.js"
      - "app.js"
      - "news.js"
      - "amazon-reports.js"
      - "revenue-insights.js"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "tests/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit

      - name: Test current repository files at iPhone size
        run: npm run test:e2e
        env:
          CI: true
          BASE_URL: http://127.0.0.1:4173

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-mobile-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
