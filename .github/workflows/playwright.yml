name: Playwright mobile smoke tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "amazon-scout.html"
      - "local-ai-test.html"
      - "local-ai-test.js"
      - "local-ai-worker.js"
      - "app.js"
      - "candidate-backup.js"
      - "domestic-candidates.js"
      - "server/lolipop/competitor.php"
      - "scripts/verify-competitor.php"
      - "news.js"
      - "news-collage.js"
      - "product-flow.js"
      - "amazon-product-search.js"
      - "server/lolipop/amazon-creators.php"
      - "scripts/verify-amazon-discovery.php"
      - "product-flow.css"
      - "server/lolipop/product-flow.php"
      - "lovely-watch.js"
      - "new-product-ranking.js"
      - "server/lolipop/lovely-watch.php"
      - "server/lolipop/overseas.php"
      - "server/lolipop/news.php"
      - "server/lolipop/news-extra.php"
      - "server/lolipop/news-bandai.php"
      - "server/lolipop/news-gashapon.php"
      - "server/lolipop/news-thankyou.php"
      - "scripts/verify-product-ai.php"
      - "scripts/verify-deployed-news-extra.php"
      - "amazon-reports.js"
      - "revenue-insights.js"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "tests/**"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "amazon-scout.html"
      - "local-ai-test.html"
      - "local-ai-test.js"
      - "local-ai-worker.js"
      - "app.js"
      - "candidate-backup.js"
      - "domestic-candidates.js"
      - "server/lolipop/competitor.php"
      - "scripts/verify-competitor.php"
      - "news.js"
      - "news-collage.js"
      - "product-flow.js"
      - "amazon-product-search.js"
      - "server/lolipop/amazon-creators.php"
      - "scripts/verify-amazon-discovery.php"
      - "product-flow.css"
      - "server/lolipop/product-flow.php"
      - "lovely-watch.js"
      - "new-product-ranking.js"
      - "server/lolipop/lovely-watch.php"
      - "server/lolipop/overseas.php"
      - "server/lolipop/news.php"
      - "server/lolipop/news-extra.php"
      - "server/lolipop/news-bandai.php"
      - "server/lolipop/news-gashapon.php"
      - "server/lolipop/news-thankyou.php"
      - "scripts/verify-product-ai.php"
      - "scripts/verify-deployed-news-extra.php"
      - "amazon-reports.js"
      - "revenue-insights.js"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - "tests/**"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check product PHP API and parsers
        run: |
          php -l server/lolipop/competitor.php
          php -l scripts/verify-competitor.php
          php -l server/lolipop/amazon-creators.php
          php tests/amazon-creators.php
          php -l scripts/verify-amazon-discovery.php
          php -l server/lolipop/product-flow.php
          php tests/product-flow.php
          php -l server/lolipop/lovely-watch.php
          php tests/lovely-parser.php
          php tests/hatakeyama-parser.php
          php tests/gourmandise-parser.php
          php tests/skater-parser.php
          php -l server/lolipop/overseas.php
          php -l server/lolipop/news.php
          php -l server/lolipop/news-extra.php
          php -l server/lolipop/news-bandai.php
          php -l server/lolipop/news-gashapon.php
          php -l server/lolipop/news-thankyou.php
          php tests/thankyou-parser.php
          php tests/news-parser.php
          php tests/bandai-parser.php
          php tests/gashapon-parser.php
          php -l scripts/verify-product-ai.php
          php -l scripts/verify-deployed-news-extra.php

      - name: Check news identity and saved progress
        run: node tests/news-progress.test.cjs

      - name: Install locked dependencies
        run: npm ci

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit

      - name: Test current repository files at iPhone size
        run: npm run test:e2e
        env:
          CI: true
          BASE_URL: http://127.0.0.1:4173

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-mobile-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
