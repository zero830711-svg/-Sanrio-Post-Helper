name: Playwright mobile smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test the live GitHub Pages site
        run: npm run test:e2e
        env:
          CI: true
          BASE_URL: https://zero830711-svg.github.io/-Sanrio-Post-Helper

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-mobile-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
