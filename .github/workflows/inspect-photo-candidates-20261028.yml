name: Inspect photo library for article candidates
on:
  push:
    paths: ['.github/workflows/inspect-photo-candidates-20261028.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      WP_USER: ${{ secrets.SANRIO_WP_USER }}
      WP_PASSWORD: ${{ secrets.SANRIO_WP_APP_PASSWORD }}
    steps:
      - name: List recent media metadata
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse
          token = base64.b64encode((os.environ['WP_USER']+':'+os.environ['WP_PASSWORD']).encode()).decode()
          for page in range(1,6):
              url='https://sanrio-fan.site/wp-json/wp/v2/media?'+urllib.parse.urlencode({'per_page':100,'page':page,'_fields':'id,date,slug,source_url,title,alt_text,caption,post'})
              req=urllib.request.Request(url,headers={'Authorization':'Basic '+token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as res: data=json.load(res)
              except Exception as e:
                  print('STOP',type(e).__name__,str(e)); break
              for v in data: print(json.dumps(v,ensure_ascii=False))
          PY
